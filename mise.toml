#:schema https://mise.jdx.dev/schema/mise.json
#
# prick — the single source of truth for tooling and the task graph.
#
# A contributor installs exactly one thing (mise) and runs `mise run bootstrap`.
# `mise run ci` is a SUPERSET of .github/workflows/ci.yml: it runs everything CI
# runs, plus `audit` and the full `build`. See the Gates section of AGENTS.md for
# why those two are deliberately not CI jobs.
#
# ---------------------------------------------------------------------------
# TASK BODY DISCIPLINE — read before adding a task
# ---------------------------------------------------------------------------
# A task body is ONE executable invocation with arguments. No pipes, no `&&`,
# no `$(...)`, no shell globs, no `if`. Anything that needs branching lives in
# scripts/*.mjs and is invoked as `node scripts/<name>.mjs`.
#
# This is not style. The dev machine is Windows 11 and CI is a 3-OS matrix; a
# body that contains no shell syntax behaves identically under cmd.exe, pwsh,
# bash and dash, so `mise run ci` means the same thing everywhere. Where a
# platform-specific command is genuinely unavoidable (`clean`), the platform
# interpreter is named as the executable rather than assumed from the ambient
# shell.
#
# NOTE (verified on mise 2026.8.2): `windows_default_inline_shell_args` and
# `unix_default_inline_shell_args` are deliberately IGNORED by mise when set in
# a non-global config — mise prints
#   "<setting> in non-global config ... is ignored for security reasons"
# on every invocation. They are therefore not set here; the discipline above is
# what makes the ambient shell irrelevant. A contributor who wants pwsh as the
# default inline shell anyway sets it once, globally and at their own choice:
#   mise settings set windows_default_inline_shell_args "pwsh -NoProfile -Command"
#   mise settings set unix_default_inline_shell_args    "bash -euo pipefail -c"

[settings]
# mise.lock records the resolved version + checksum of every tool above.
lockfile = true
# Never silently install a tool because a command was not found. Tools come
# from this file or they do not come at all.
not_found_auto_install = false

[settings.task]
# Prefix each line with the task name so parallel fan-out stays readable.
# (`task_output` at the top level is deprecated since mise 2026.8; the nested
# `task.output` key is the supported spelling.)
output = "prefix"

# ---------------------------------------------------------------------------
# TOOLS
# ---------------------------------------------------------------------------
# Cross-compilation targets are deliberately NOT declared here. `targets = [...]`
# on the rust tool makes every fresh clone download a full std for every target
# (~1 GB). Release builds add their target in the workflow, on the one runner
# that needs it.
[tools]
node = "26.7.0"
pnpm = "11.21.0"

# Stable does the work; the date-pinned nightly exists only to carry miri.
# Pinning the date keeps the miri job from breaking on unrelated PRs when a
# rolling nightly regresses. `rust-src` is required by `cargo miri setup`.
rust = [
  { version = "1.97.1", components = [
    "rustfmt",
    "clippy",
  ] },
  { version = "nightly-2026-08-01", components = [
    "miri",
    "rust-src",
  ], profile = "minimal" },
]

# Vite Plus (CLI `vp`) owns the JS-side workflow: lint, fmt, check, test, build.
# It is installed by mise, NOT by its curl installer. `vp env` is never used —
# mise owns Node, and two version managers fighting over it is the exact failure
# mode this file exists to prevent.
#
# vp ships no tools of its own (`vp --version` reports vite/oxlint/oxfmt/vitest
# as "Not found" until they are in node_modules), so every vp task below waits
# for bootstrap:js.
"npm:vite-plus" = "0.2.9"

# Dev tools use the `aqua:` backend: prebuilt, checksum-verified binaries with
# real Windows support. `cargo:` would compile each of these from source on
# every fresh Windows clone.
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.143"
"aqua:rustsec/rustsec/cargo-audit" = "0.22.2"
"aqua:crate-ci/typos" = "1.49.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.29.0"
"aqua:suzuki-shunsuke/pinact" = "4.1.1"
"aqua:evilmartians/lefthook" = "2.1.10"

# The GitHub CLI. Cutting a release needs only git — the tag push is the trigger
# — but `cli:status`, `docs:status` and `cli:dry` all go through gh, so a
# contributor without it cannot watch or rehearse a release. Pin it rather than
# assume it.
"aqua:cli/cli" = "2.97.0"

# cargo-auditable embeds the dependency list inside the binary so
# `cargo audit bin ./prk` works on a shipped artefact with no side-car SBOM.
# It has no aqua package; the cargo backend uses cargo-binstall by default, so
# this still resolves to a prebuilt release binary rather than a source build.
"cargo:cargo-auditable" = "0.7.5"

# ---------------------------------------------------------------------------
# ENVIRONMENT
# ---------------------------------------------------------------------------
[env]
# Workspace-local JS binaries (vitest, playwright, svelte-check, …).
_.path = ["{{config_root}}/node_modules/.bin"]

# Local-only worker secrets. Absent by default; values are redacted from mise
# output so a MASTER_KEY never lands in a task log.
_.file = { path = "{{config_root}}/.dev.vars", redact = true }

CARGO_TERM_COLOR = "always"
CARGO_TARGET_DIR = "{{config_root}}/target"
RUST_BACKTRACE = "1"
# CalVer is computed in UTC and only in UTC. A maintainer in UTC+5 computing a
# version locally after 19:00 would be a day ahead of CI.
TZ = "UTC"

# ---------------------------------------------------------------------------
# BOOTSTRAP
# ---------------------------------------------------------------------------
[tasks.bootstrap]
description = "Prepare a fresh clone: workspace dependencies + git hooks"
depends = ["bootstrap:js", "bootstrap:hooks"]

[tasks."bootstrap:js"]
description = "Install the pnpm workspace from the lockfile"
run = "pnpm install --frozen-lockfile"
sources = [
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "packages/*/package.json",
  "packages/npm/*/package.json",
  "e2e/package.json",
]
outputs = ["node_modules/.modules.yaml"]

[tasks."bootstrap:hooks"]
description = "Install the lefthook git hooks"
run = "lefthook install"

# ---------------------------------------------------------------------------
# FORMAT
# ---------------------------------------------------------------------------
[tasks.fmt]
description = "Format everything in place"
depends = ["fmt:rust", "fmt:js"]

[tasks."fmt:rust"]
description = "rustfmt the cargo workspace"
run = "cargo fmt --all"

[tasks."fmt:js"]
description = "Format the JS/Svelte workspace (vp fmt, Oxfmt-based)"
run = "vp fmt --write"
wait_for = ["bootstrap:js"]

[tasks."fmt:check"]
description = "Fail if anything is unformatted"
depends = ["fmt:check:rust", "fmt:check:js"]

[tasks."fmt:check:rust"]
description = "rustfmt --check"
run = "cargo fmt --all --check"

[tasks."fmt:check:js"]
description = "vp fmt --check"
run = "vp fmt --check"
wait_for = ["bootstrap:js"]

# ---------------------------------------------------------------------------
# LINT — pure fan-out, every leaf individually runnable
# ---------------------------------------------------------------------------
[tasks.lint]
description = "Every linter: clippy, vp lint, svelte-check, astro check, actionlint, zizmor, pinact, typos, file size"
depends = [
  "lint:rust",
  "lint:js",
  "lint:svelte",
  "lint:docs",
  "lint:actions",
  "lint:zizmor",
  "lint:pinact",
  "lint:typos",
  "lint:loc",
]

[tasks."lint:js:app"]
description = "vp lint over packages/app, from inside packages/app"
# `-C` is load-bearing. SvelteKit's plugin resolves `src/app.html` relative to
# the CURRENT DIRECTORY, so loading packages/app/vite.config.ts from the repo
# root aborts before a single file is linted. The root vite.config.ts
# short-circuits that discovery for `vp fmt`, but oxlint resolves vite configs
# through its own path and still walks into the nested one.
run = "vp -C packages/app lint --deny-warnings"
wait_for = ["bootstrap:js"]

[tasks."lint:js:repo"]
description = "vp lint over everything outside packages/app"
# Explicit paths rather than a bare `vp lint`, for the same reason as above: a
# bare invocation at the root rediscovers packages/app/vite.config.ts and dies.
# Naming the directories also means a new top-level package is linted only once
# somebody adds it here, which is a visible decision rather than a silent gap.
# The same two commands are duplicated in the root package.json `lint` script,
# which exists so a clone that has not run `mise install` still has a working
# gate (see the catalog note in pnpm-workspace.yaml). A new package has to be
# added in BOTH places, or one of the two entry points silently skips it.
run = "vp lint --deny-warnings scripts action packages/mcp packages/shared packages/docs e2e"
wait_for = ["bootstrap:js"]

[tasks."lint:rust"]
description = "clippy over the whole workspace, warnings are errors"
run = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"

[tasks."lint:js"]
description = "vp lint (Oxlint) across the workspace; replaces a standalone oxlint invocation"
# Split in two because packages/app must be linted from its own directory --
# see lint:js:app. A single bare `vp lint` at the root cannot work.
depends = ["lint:js:app", "lint:js:repo"]

[tasks."lint:svelte"]
description = "svelte-check — neither vp lint nor tsc typechecks .svelte files"
# Delegated to the package script because it must run `svelte-kit sync` first,
# which is two commands and therefore not a legal task body here.
# Deliberately overlaps with `typecheck` (which fans out to the same script
# through pnpm -r): the app's Svelte types are worth checking under `lint` on
# their own, and svelte-check on this app costs a few seconds.
run = "pnpm --dir packages/app run typecheck"
wait_for = ["bootstrap:js"]

[tasks."lint:docs"]
description = "astro check — the docs site renders docs/, so it must build with it"
# Delegated to the package script for the same reason as lint:svelte: it is the
# one definition of what checking this package means.
#
# `packages/docs` is a RENDERER. `DOCS_BASE = "../../docs"` in its
# docs-source.ts points the Astro loader at the repository's own `docs/`
# directory, so the markdown outside this package is an input to this build --
# which is why CI gates this task on `docs/**` and not merely on
# `packages/docs/**`.
#
# Deliberately overlaps with `typecheck`, which reaches the same script through
# `pnpm -r`. Same trade lint:svelte makes: worth a few seconds under `lint` on
# its own.
run = "pnpm --dir packages/docs run typecheck"
wait_for = ["bootstrap:js"]

[tasks."lint:loc"]
description = "Fail if any source file exceeds 1000 lines"
# Reviewability, not aesthetics. A file nobody reads end to end is where a
# subtle change hides, and here that means the write path, the argument escaper
# and the token store -- exactly the files that grow.
#
# No per-file exemption list by design; see the header of check-loc.mjs. Only
# tool-generated output is excluded, because "split this" is not advice the
# author can act on.
run = "node scripts/check-loc.mjs"

[tasks.openapi]
description = "Regenerate docs/openapi.json from the Hono router"
run = "node scripts/openapi.mjs write"

[tasks."openapi:check"]
description = "Fail if docs/openapi.json is stale"
# Also covered by test/http/openapi.test.ts, which deep-compares the committed
# document against what the router actually serves. Kept as its own task so a
# stale document fails with one obvious message rather than inside a suite.
run = "node scripts/openapi.mjs check"

[tasks."lint:actions"]
description = "actionlint over .github/workflows"
run = "actionlint"

[tasks."lint:zizmor"]
description = "zizmor static analysis of the workflows"
run = "zizmor .github/workflows"

[tasks."lint:pinact"]
description = "Assert every action is pinned to a 40-char SHA"
run = "pinact run --check"

[tasks."lint:typos"]
description = "Spellcheck the tree"
run = "typos"

# ---------------------------------------------------------------------------
# TYPECHECK
# ---------------------------------------------------------------------------
[tasks.typecheck]
description = "TypeScript typecheck across the workspace"
# NOT `vp check`. Verified against vp 0.2.9: plain `vp check` is fmt + lint +
# typecheck, so it would duplicate fmt:check:js and lint:js inside `ci`; and
# narrowing it with `vp check --no-fmt --no-lint` exits non-zero with
# "No checks enabled" unless `lint.options.typeCheck` is set in vite.config.ts,
# which nothing in this repo sets. Delegating to each package's own `typecheck`
# script runs svelte-check for packages/app and tsc --noEmit for e2e today, and
# picks up new packages automatically. Revisit if Vite+ gains a typecheck-only
# subcommand.
run = "pnpm --recursive --if-present run typecheck"
wait_for = ["bootstrap:js"]

# ---------------------------------------------------------------------------
# TEST — pure fan-out
# ---------------------------------------------------------------------------
[tasks.test]
description = "Rust, JS and repo-script test suites"
depends = ["test:rust", "test:doc", "test:js", "test:scripts", "test:action", "test:mcp"]

[tasks."test:rust"]
description = "cargo nextest over the workspace"
run = "cargo nextest run --workspace --all-features --locked"

[tasks."test:doc"]
description = "Doc tests — nextest cannot run these, so they need their own pass"
run = "cargo test --workspace --doc --locked"

[tasks."test:js"]
description = "vp test — Vitest against packages/app (vitest-pool-workers)"
# Scoped with -C, verified against vp 0.2.9 for two reasons: at the workspace
# root vp hands Vitest the whole tree, which sweeps up scripts/*.test.mjs (those
# are node:test files, owned by test:scripts); and e2e's own `test` script is
# Playwright, which must not run here.
# `run` is explicit rather than relying on vp's run-once default.
# Fallback if vitest-pool-workers turns out not to work under vp: replace with
# `pnpm --dir packages/app run test` — a one-line swap.
run = "vp -C packages/app test run"
wait_for = ["bootstrap:js"]

[tasks."test:scripts"]
description = "node:test suites for scripts/*.mjs"
# `node --test <dir>` no longer walks a directory in Node 26 — it tries to load
# the path as a module and fails with MODULE_NOT_FOUND. Running from inside
# scripts/ with no positional uses node's own recursive discovery instead, which
# also keeps the body free of a glob.
dir = "{{config_root}}/scripts"
run = "node --test"

[tasks."test:action"]
description = "node:test suite for the composite GitHub Action"
# Same Node 26 directory-walking caveat as test:scripts above.
dir = "{{config_root}}/action"
run = "node --test"

[tasks."test:mcp"]
description = "node:test suite for the MCP server package"
# node:test rather than vitest: this package runs under plain Node, not workerd,
# and test:js is scoped to packages/app.
#
# Delegates to the package's own `test` script rather than calling `node --test`
# directly. That script carries `--import ./test/support/shared-ts-resolve.ts`,
# without which the schema-drift suite cannot load @prick/shared from source and
# fails. Reaching past a package's script to its underlying command silently
# drops flags the package considers part of running its tests.
run = "pnpm --dir packages/mcp run test"

[tasks."build:mcp"]
description = "tsc build of the MCP server package"
run = "pnpm --dir packages/mcp run build"

[tasks.miri]
description = "Machine-checked proof that prick-core is pure (no I/O, no unsafe)"
# The pinned nightly is activated for this task only, so `cargo` stays stable
# everywhere else.
tools = { rust = "nightly-2026-08-01" }
env = { MIRIFLAGS = "-Zmiri-strict-provenance" }
run = "cargo miri nextest run --package prick-core"

# ---------------------------------------------------------------------------
# DEV / E2E
# ---------------------------------------------------------------------------
[tasks.dev]
description = "Run the Worker + SvelteKit dev server"
run = "pnpm --dir packages/app run dev"

# `dev` serves the application, and every request to it answers 401: there is no
# Cloudflare Access in front of a local server, and the Worker has no bypass --
# a "skip verification locally" flag would be a code path in the shipped Worker
# whose purpose is accepting an unverified identity.
#
# `demo` supplies the real thing instead of disabling the check. It reuses the
# e2e harness: a genuine keypair, a real JWKS over a real HTTPS origin, genuine
# Access JWTs, and a proxy standing where Access would. The verifier runs
# unmodified. Then it seeds projects, environments, secrets with history, and a
# few audited reads, and serves the result on loopback.
#
# For looking at the UI. Not a deployment path, and not a substitute for `dev`.
[tasks.demo]
description = "Run a signed-in, seeded copy of the app for browsing (PRICK_DEMO_ROLE, PRICK_DEMO_PORT)"
run = "pnpm --dir e2e run serve"
wait_for = ["bootstrap:js"]

# Pictures of every screen, for the README and for reviewing a visual change
# without needing a browser. Reads the demo server rather than starting one:
# `demo` is long-lived and interactive, and a task that owned both would have to
# race its own server's readiness. The script says so if nothing is listening.
[tasks.screenshots]
description = "Capture screenshots/ from a running `mise run demo` (--only=, --light)"
run = "node scripts/screenshots.mjs"
wait_for = ["bootstrap:js"]

[tasks."e2e:install"]
description = "Download the Playwright browsers (CI runs this only on a cache miss)"
# Browser binaries ONLY. This used to be `playwright install --with-deps`, and
# the `--with-deps` half is now a separate task for two independent reasons.
#
# The first is that it does not belong in a task CI runs on a cache miss.
# `--with-deps` shells out to `apt-get update && apt-get install` as root, and
# apt is the one part of this that is neither cacheable nor bounded: it hung a
# CI run for 24 minutes reaching a dead `azure.archive.ubuntu.com` before the
# job timeout killed it. Downloading a browser from a CDN and mutating the
# host's package database are not the same operation and should not fail as
# one.
#
# The second is that a contributor typing `mise run e2e:install` should not
# have a task silently escalate to root and install system packages.
run = "pnpm --dir e2e run install-browsers"
wait_for = ["bootstrap:js"]

[tasks."e2e:install:deps"]
description = "Install the system libraries Chromium needs (bare Linux only; needs root)"
# NOT run by CI, deliberately -- see the e2e job in .github/workflows/ci.yml.
# The GitHub ubuntu-24.04 image ships Chrome, Chromium, Edge and Firefox as
# .deb packages, so apt has already pulled in every shared library Playwright's
# chromium needs; running apt there costs a network round trip to install
# nothing.
#
# This exists for a bare Linux box, where those libraries genuinely are absent.
# It is a no-op on macOS and Windows.
run = "pnpm --dir e2e run install-browser-deps"
wait_for = ["bootstrap:js"]

[tasks.e2e]
description = "Playwright end-to-end suite"
run = "pnpm --dir e2e run test"
# Not a `depends`: CI installs the browsers only on a cache miss, and forcing an
# install on every local run would undo that. `wait_for` orders the two when
# both are scheduled and does nothing otherwise.
wait_for = ["bootstrap:js", "build:js", "e2e:install"]

# ---------------------------------------------------------------------------
# BUILD
# ---------------------------------------------------------------------------
[tasks.build]
description = "Build the CLI and the Worker bundle"
depends = ["build:rust", "build:js", "build:mcp"]

[tasks."build:rust"]
description = "cargo build --release for the host target"
run = "cargo build --workspace --release --locked"

[tasks."build:js"]
description = "vp build — the SvelteKit + adapter-cloudflare Worker bundle"
# Scoped with -C because vp 0.2.9 refuses to build at the workspace root:
# "`vp build` at the workspace root needs a target package."
# Fallback if vp does not drive the SvelteKit build: replace with
# `pnpm --dir packages/app run build` — a one-line swap.
run = "vp -C packages/app build"
wait_for = ["bootstrap:js"]

[tasks."build:dist"]
description = "Release build of prk for one target triple"
usage = 'arg "<target>" help="Rust target triple, e.g. x86_64-unknown-linux-musl"'
run = "cargo build --locked --profile dist --package prk --bin prk --target {{ usage.target }}"

[tasks."build:auditable"]
description = "Release build of prk with the dependency list embedded in the binary"
usage = 'arg "<target>" help="Rust target triple, e.g. x86_64-unknown-linux-musl"'
run = "cargo auditable build --locked --profile dist --package prk --bin prk --target {{ usage.target }}"

# ---------------------------------------------------------------------------
# SUPPLY CHAIN
# ---------------------------------------------------------------------------
[tasks.deny]
description = "cargo-deny: licences, bans, advisories and the git-source ban"
run = "cargo deny check"

[tasks.audit]
description = "Advisory audit of both dependency trees"
depends = ["audit:rust", "audit:js"]

[tasks."audit:rust"]
description = "RustSec advisories against Cargo.lock"
run = "cargo audit --deny warnings"

[tasks."audit:js"]
description = "npm advisories against the pnpm lockfile"
run = "pnpm audit --audit-level high"
wait_for = ["bootstrap:js"]

[tasks."audit:bin"]
description = "RustSec advisories read from a built binary's embedded dependency list"
usage = 'arg "<binary>" help="Path to a binary produced by build:auditable"'
run = "cargo audit bin {{ usage.binary }}"

# ---------------------------------------------------------------------------
# VERSIONING — scripts/version.mjs is the single writer of every version string
# ---------------------------------------------------------------------------
[tasks."version:plan"]
description = "Compute today's CalVer and the tag that claims it"
run = "node scripts/version.mjs plan"

[tasks."version:set"]
description = "Stamp a version into every manifest"
usage = 'arg "<version>" help="CalVer version, e.g. 2026.815.0"'
run = "node scripts/version.mjs set {{ usage.version }}"

[tasks."version:check"]
description = "Assert every manifest carries the same version"
run = "node scripts/version.mjs check"

# ---------------------------------------------------------------------------
# RELEASE — two lines, one mechanism
# ---------------------------------------------------------------------------
# There are two release lines, `cli:*` and `docs:*`. They work identically and
# differ only in their tag prefix: `v` for the CLI, `docs-v` for the
# documentation site.
#
# CUTTING THE VERSION IS WHAT RELEASES IT. `*:cut` computes the next CalVer
# version, requires a typed confirmation of the tag, then creates an annotated
# tag and pushes it. That push is the workflow trigger; nothing else starts a
# release, and neither workflow computes a version of its own.
#
# The tag is the lock. git refuses to push a ref that already exists, so two
# people cutting in the same second cannot both take the same N: the loser's
# push is rejected and scripts/version.mjs recomputes N against the tags that
# then exist. There is no external mutex and nothing to leak.
#
# The two prefixes count N independently, so cutting docs three times in a day
# does not make the next CLI release `.3`.
#
# `release:*` used to be the name of the CLI line. It was renamed because
# "release" stopped having an unambiguous subject once the docs site had a
# release line of its own.

[tasks."cli:next"]
description = "Print the version the next CLI release would take. Read-only, never prompts"
run = "node scripts/cli-release.mjs next"

[tasks."cli:dry"]
# Dispatches against the branch you are on, so a change to cli-release.yml is
# rehearsed by the branch that carries it. Override with
# `mise run cli:dry -- --ref <branch>`. The branch must be pushed: GitHub reads
# the workflow from the remote ref, so an unpushed branch would rehearse
# whatever origin already has under that name.
description = "Dispatch cli-release.yml with dry_run=true on the current branch — builds and stages everything, claims no version, publishes nothing"
run = "node scripts/cli-release.mjs dry"

[tasks."cli:cut"]
description = "Release the CLI: tag and push, which builds, publishes to npm and creates the GitHub Release. Requires a typed confirmation"
# Pass --yes for automation: `mise run cli:cut -- --yes`.
run = "node scripts/cli-release.mjs cut"

[tasks."cli:status"]
description = "Follow the most recent cli-release.yml run. Read-only"
run = "node scripts/cli-release.mjs status"

# --- the other distribution channels ---------------------------------------
# npm and the GitHub release are cli-release.yml's own doing. These two tasks
# cover the rest: the source registry, and the manifests the OS package managers
# read. Both are called by cli-release.yml AND runnable here, so the release
# path is rehearsable on a laptop rather than only in CI.

[tasks."publish:crates"]
description = "Publish every publishable crate to crates.io, in dependency order"
usage = 'flag "--dry-run" help="Run every pre-upload check and stop before the HTTP PUT"'
# --workspace does the ordering: cargo reads the dependency graph, publishes
# prick-core first and prk last, and verifies each crate against the siblings it
# just packaged rather than against the registry. xtask stays out of it by
# setting `publish = false`.
#
# --allow-dirty is load-bearing and is NOT a shortcut. Every manifest in this
# repository reads 0.0.0-dev; `version:set` stamps the released version in
# immediately before this runs, so the tree is dirty by design, in exactly the
# files cargo is about to package.
#
# Run `mise run publish:crates --dry-run` before touching anything a package
# boundary depends on -- it packages and compiles all five crates and stops at
# the upload, which is the only check that sees what crates.io will see.
run = "cargo publish --workspace --locked --allow-dirty {% if usage.dry_run %}--dry-run{% endif %}"

[tasks."dist:manifests"]
description = "Render the Scoop manifest and Homebrew formula from a release's SHA256SUMS"
usage = '''
arg "<version>" help="CalVer version, e.g. 2026.815.0"
arg "<checksums>" help="Path to the SHA256SUMS the package job wrote"
arg "<out>" help="Directory to render scoop/ and homebrew/ into"
'''
run = "node scripts/dist-manifests.mjs --version {{ usage.version }} --checksums {{ usage.checksums }} --out {{ usage.out }}"

# --- documentation site ----------------------------------------------------
# The docs site is a SEPARATE Worker from the app: public, no secrets, no
# access control. Cloudflare credentials live in GitHub repository secrets, so
# the build and deploy run in CI; nothing here needs a Cloudflare token on a
# developer machine.
#
# NAME COLLISION, resolved. `docs:preview` keeps the meaning `preview` has in
# every JS toolchain -- serve the built output locally -- because breaking that
# would be its own ambiguity. The version preview is `docs:next`, which says
# what it prints, and `cli:next` is its counterpart. `preview` never means two
# things.

[tasks."docs:dev"]
description = "Run the documentation site locally with hot reload"
run = "pnpm --dir packages/docs run dev"
raw = true

[tasks."docs:build"]
description = "Build the documentation site from the docs/ Markdown"
run = "pnpm --dir packages/docs run build"

[tasks."docs:preview"]
description = "Serve the built documentation site locally"
run = "pnpm --dir packages/docs run preview"
raw = true

[tasks."docs:next"]
description = "Print the version the next docs release would take. Read-only, never prompts"
run = "node scripts/docs.mjs next"

[tasks."docs:cut"]
description = "Release the docs site: tag and push, which builds, deploys the prick-docs Worker and creates the GitHub Release. Requires a typed confirmation"
# Pass --yes for automation: `mise run docs:cut -- --yes`.
run = "node scripts/docs.mjs cut"

[tasks."docs:status"]
description = "Follow the most recent docs-release.yml run. Read-only"
run = "node scripts/docs.mjs status"

# ---------------------------------------------------------------------------
# CI — pure fan-out; an exact mirror of ci.yml
# ---------------------------------------------------------------------------
[tasks.ci]
description = "Everything CI runs, in the order CI runs it"
depends = [
  "bootstrap",
  "fmt:check",
  "lint",
  "typecheck",
  "test",
  "openapi:check",
  "deny",
  "audit",
  "miri",
  "build",
  "e2e:install",
  "e2e",
  "version:check",
]

# ---------------------------------------------------------------------------
# CLEAN — the one task with a platform override, because deleting a directory
# tree is the one thing with no portable spelling. The Windows body names pwsh
# as the executable rather than relying on the ambient inline shell.
# ---------------------------------------------------------------------------
[tasks.clean]
description = "Remove build outputs and installed dependencies"
run = "rm -rf target dist node_modules .svelte-kit"
run_windows = "pwsh -NoProfile -Command Remove-Item -Recurse -Force -ErrorAction SilentlyContinue 'target','dist','node_modules','.svelte-kit'"
