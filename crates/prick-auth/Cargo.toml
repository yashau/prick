[package]
name = "prick-auth"
description = "Cloudflare Access authentication for prick: managed OAuth with PKCE, service tokens, token storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
prick-api = { workspace = true }
prick-core = { workspace = true }

getrandom = { workspace = true }
open = { workspace = true }
percent-encoding = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

# The transport, for the token endpoint and the discovery documents. Pulled in
# directly rather than re-exported so the OAuth handshake goes through the same
# three-stage response reading as every other request.
reqwest = { workspace = true }
tokio = { workspace = true }

# On Windows there is no file mode, so the token file's DACL has to be set
# explicitly. That needs the Windows security APIs, which need `unsafe`, which
# lives in exactly one crate in this workspace.
[target.'cfg(windows)'.dependencies]
prick-exec = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
wiremock = { workspace = true }

[lints]
workspace = true
