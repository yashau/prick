[package]
name = "prk"
description = "prick — Portable Runtime Injection of Cloudflare (stored) Keys. Command-line client for a self-hosted secrets manager."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# lib + bin: the library exposes the clap `Command` so xtask can generate shell
# completions and man pages from the single source of truth, and so integration
# tests can exercise argument parsing without spawning a process.
[lib]
name = "prk"
path = "src/lib.rs"

[[bin]]
name = "prk"
path = "src/main.rs"

[dependencies]
prick-api = { workspace = true }
prick-auth = { workspace = true }
prick-core = { workspace = true }
prick-exec = { workspace = true }

clap = { workspace = true }
clap_complete = { workspace = true }
rpassword = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

# ---------------------------------------------------------------------------
# cargo-binstall: fetch the release archive instead of compiling from source.
#
# Without this, `cargo binstall prk` guesses at a URL layout we do not use and
# falls back to `cargo install` -- a five-minute compile to obtain a binary that
# is already built, signed and attested on the release page.
#
# Every string below must agree with the archive step in cli-release.yml, which
# stages each build into `prk-<version>-<target>/` and archives that directory
# by name. scripts/dist-manifests.test.mjs asserts the same naming for Scoop and
# Homebrew; this block is the third consumer of it.
# ---------------------------------------------------------------------------
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/prk-{ version }-{ target }.{ archive-format }"
# The binary sits inside the staging directory, not at the archive root.
bin-dir = "prk-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

# Windows ships a zip, because a .tar.gz is not something Explorer opens.
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
