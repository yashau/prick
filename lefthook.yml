# Git hooks.
#
# Two rules govern everything in this file.
#
# 1. pre-commit is for fast checks only. A hook that takes forty seconds is a
#    hook that gets `--no-verify`'d, and once that habit forms every check in it
#    is dead -- including the ones that were cheap. So pre-commit runs
#    formatters and single-pass linters over STAGED FILES ONLY, and anything
#    that compiles the workspace goes in pre-push.
#
# 2. Every job body is one executable with arguments. No pipes, no `&&`, no
#    `$(...)`, no globs, no `if`. lefthook hands the string to the platform
#    shell, which on this repository's primary development machine is Windows:
#    a body that works in Git Bash and fails in PowerShell is a body that works
#    for exactly one contributor. Anything needing branching belongs in a mise
#    task or a script under scripts/.
#
# Bypass with `git commit --no-verify` when you must. CI re-runs all of it, so
# bypassing costs you a round trip rather than letting something through.

assert_lefthook_installed: true
colors: true

pre-commit:
  parallel: true
  jobs:
    # Formatters run first conceptually, and re-stage what they rewrite, so the
    # commit contains the formatted bytes rather than failing and making you run
    # the formatter yourself.
    - name: rustfmt
      glob: "*.rs"
      # --edition is passed explicitly: rustfmt invoked directly does not read
      # the edition from Cargo.toml the way `cargo fmt` does, and 2015-mode
      # formatting of 2024 code is silently wrong rather than an error.
      run: rustfmt --edition 2024 {staged_files}
      stage_fixed: true

    # No `svelte` in this glob. `vp fmt` is Oxfmt, which has no Svelte support:
    # hand it a .svelte file and it drops it silently, so the glob was promising
    # a formatter that never ran. Harmless on a mixed commit, fatal on a commit
    # that stages ONLY .svelte files -- every path gets excluded, Oxfmt finds no
    # targets at all, and it exits 2:
    #
    #     Expected at least one target file. All matched files may have been
    #     excluded by ignore rules.
    #
    # Same failure mode as lint-js-app below, found the same way: the hook was
    # broken for a whole class of commits, and which class depended on what you
    # staged. .svelte files are formatted by nothing in this repository at
    # present; listing them here did not change that, it only hid it.
    - name: fmt-js
      glob: "*.{js,mjs,cjs,ts,mts,cts,jsx,tsx,json,jsonc,json5,css,md,yml,yaml,html}"
      run: vp fmt {staged_files}
      stage_fixed: true

    # Split in two for the same reason `lint:js` is -- see `lint:js:app` in
    # mise.toml. Oxlint resolves vite configs through its own path and walks
    # into `packages/app/vite.config.ts`, whose SvelteKit plugin resolves
    # `src/app.html` relative to the CURRENT DIRECTORY and aborts before linting
    # anything. The root `vite.config.ts` short-circuits that for `vp fmt`, but
    # not for oxlint.
    #
    # A single `vp lint {staged_files}` at the root therefore fails outright the
    # moment a commit stages only files under packages/app -- which is exactly
    # how this was found, on a one-file commit. It had been passing on mixed
    # commits, where oxlint happened to resolve the root config instead, so the
    # hook was broken for months in a way that depended on what you staged.
    - name: lint-js-app
      root: "packages/app/"
      glob: "*.{js,mjs,cjs,ts,mts,cts,jsx,tsx,svelte}"
      run: vp lint {staged_files}

    - name: lint-js-repo
      glob: "*.{js,mjs,cjs,ts,mts,cts,jsx,tsx,svelte}"
      exclude:
        - "packages/app/**"
      run: vp lint {staged_files}

    # `--force-exclude` because this job names paths EXPLICITLY. Without it,
    # typos honours `_typos.toml`'s `extend-exclude` only for files it
    # discovers by walking, so anything excluded there is still checked the
    # moment it is staged -- which is every excluded file's whole purpose
    # defeated at the one point it matters. It also means a staged PNG is read
    # as text and every letter run in the compressed bytes is a "misspelling".
    - name: typos
      run: typos --force-exclude {staged_files}

    # Workflow files are the one thing in this repository with no local test:
    # a syntax error is discovered by pushing it. Both of these are sub-second.
    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}

    - name: zizmor
      glob: ".github/workflows/*.{yml,yaml}"
      run: zizmor --no-progress --persona=regular {staged_files}

    # The version literal must be identical in Cargo.toml, every package.json
    # and the git tag. Cheap to check, tedious to discover during a release.
    - name: version-drift
      glob: "{Cargo.toml,**/package.json,scripts/version.mjs}"
      run: mise run version:check

pre-push:
  parallel: true
  jobs:
    # Everything here compiles or executes the workspace, which is why none of
    # it is in pre-commit. Pushing is already a moment you wait for.
    - name: clippy
      run: mise run lint:rust

    - name: test-rust
      run: mise run test:rust

    - name: typecheck
      run: mise run typecheck

    - name: test-js
      run: mise run test:js
