name: CLI release

# CUTTING THE VERSION IS WHAT RELEASES.
#
# `mise run cli:cut` computes the CalVer version, takes a typed confirmation,
# creates the annotated `v<version>` tag and pushes it. That push is the trigger
# below. This workflow computes no version and claims nothing: it builds,
# publishes and releases the commit it was handed.
#
# The tag is still the lock — git refuses to push a ref that already exists, so
# two people cutting in the same second cannot both take the same N — but the
# claim, and the retry when it is lost, now happen in scripts/version.mjs
# (`claimTag`) before any runner starts. Consequences worth stating:
#
#   * this workflow needs no `contents: write` to plan and persists no git
#     credential; the only write permission left is the one that creates the
#     GitHub Release.
#   * the version is a decision a human made, recorded in git, before CI ran --
#     rather than something CI derived and the human read about afterwards.
#   * docs-release.yml works identically. One mechanism, two release lines.
#
# `v*` cannot collide with the documentation line's `docs-v*`: a tag glob is
# anchored at the start of the ref name, and `docs-v2026.815.0` does not begin
# with `v`. Asserted in scripts/version.test.mjs rather than assumed.
on:
  push:
    tags:
      - "v*"
  # Dry runs only. A dispatched run builds every binary and stages every npm
  # package so the pipeline can be exercised without claiming a version; the
  # publish and release jobs below are gated on the event being a tag push, so a
  # dispatch can never publish however its inputs are set.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package everything, but publish nothing. A dispatched run cannot publish; leave this true"
        type: boolean
        default: true

permissions:
  contents: read

# Never cancel a release. A cancelled run between `npm publish` and the dist-tag
# flip leaves the registry in a half-published state that no rerun can undo,
# because npm versions are immutable.
concurrency:
  group: cli-release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # CalVer is computed in UTC. A runner on any other zone would compute a
  # different date for six hours a day.
  TZ: UTC

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # RESOLVE the version. It is not computed here and it is not claimed here.
  #
  #   tag push  -> the version is the tag, minus its `v`. The claim already
  #                happened, locally, in `mise run cli:cut`.
  #   dispatch  -> nothing has been claimed, so a read-only prediction stands in
  #                so that the packaging steps have a plausible version to stamp.
  #                `version.mjs plan` reads tags and writes none.
  #
  # This job holds no write permission and persists no credential. That is the
  # point of the inversion: nothing in CI can move a ref.
  # ---------------------------------------------------------------------------
  version:
    name: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The dispatch path predicts N from how many tags already exist for
          # today, so the full tag list must be present -- a shallow clone
          # silently predicts N=0.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # Caching is off in BOTH directions. This workflow is reachable only
          # by a tag push, and it publishes to npm and creates a GitHub Release
          # -- so it is a publishing workflow in exactly the sense that makes a
          # restored cache entry dangerous.
          #
          #   cache_save: false  would only stop us writing an entry a later
          #                      privileged run consumes.
          #   cache: false       also stops us READING one -- which is the
          #                      actual cache-poisoning path: a lower-privilege
          #                      workflow (e.g. a fork PR) writes a malicious
          #                      entry, and this job restores it and ships the
          #                      result to the registry.
          #
          # A cold toolchain install costs ~30s. Releases are not hot-path.
          cache: false

      # A dispatched run can never publish (see the `if:` on publish-npm and
      # github-release). Saying so out loud beats letting somebody dispatch with
      # dry_run=false and wonder why nothing reached npm.
      - name: Refuse a non-dry dispatch
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          echo '::error::A dispatched run cannot publish. Releasing is "mise run cli:cut", which pushes the tag that triggers this workflow.'
          exit 1

      - name: Resolve version
        id: resolve
        env:
          # Through the environment, never interpolated into the script body: a
          # ref name is chosen by whoever pushed the tag.
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "push" ]; then
            version="${REF_NAME#v}"
            # The tag is the only input, so it is validated rather than trusted.
            # `version.mjs set` would reject a bad one later; failing here says
            # why, before six build legs have run.
            if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "::error::${REF_NAME} is not a CalVer release tag (expected vYYYY.MMDD.N with no leading zeros)."
              exit 1
            fi
            tag="$REF_NAME"
            echo "released version ${version} from tag ${tag}"
          else
            version="$(node scripts/version.mjs plan | awk '$1 == "version" { print $2 }')"
            tag="v${version}"
            echo "dry run: predicted ${tag}. No tag is claimed and nothing is published."
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          {
            echo "### CLI release"
            echo
            echo "- trigger: \`${EVENT}\`"
            echo "- version: \`${VERSION}\`"
            echo "- tag: \`${TAG}\`"
            if [ "$EVENT" != "push" ]; then
              echo
              echo "Dry run — no tag was claimed and nothing will be published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Six runner legs, eight artefacts. macOS and Windows each build two targets
  # in one job: the macOS SDK is universal, and the Windows image ships both the
  # x64 and ARM64 MSVC toolchains, so a second runner would buy nothing.
  #
  # No `cross`, no Docker, no qemu -- free arm64 runners exist now, so every
  # target is built natively or by a first-party cross-linker.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # A partial set of binaries must never reach `package`. If one target
      # fails to compile, the release does not happen.
      fail-fast: true
      matrix:
        include:
          - name: linux-x64-gnu
            os: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu
          - name: linux-x64-musl
            os: ubuntu-24.04
            targets: x86_64-unknown-linux-musl
          - name: linux-arm64-gnu
            os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu
          - name: linux-arm64-musl
            os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-musl
          - name: darwin
            os: macos-15
            targets: x86_64-apple-darwin aarch64-apple-darwin
          - name: windows
            os: windows-2025
            targets: x86_64-pc-windows-msvc aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag was created at this commit, so building the SHA is the same
          # tree without racing the tag's propagation to the API.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # Caching is off in BOTH directions. This workflow is reachable only
          # by a tag push, and it publishes to npm and creates a GitHub Release
          # -- so it is a publishing workflow in exactly the sense that makes a
          # restored cache entry dangerous.
          #
          #   cache_save: false  would only stop us writing an entry a later
          #                      privileged run consumes.
          #   cache: false       also stops us READING one -- which is the
          #                      actual cache-poisoning path: a lower-privilege
          #                      workflow (e.g. a fork PR) writes a malicious
          #                      entry, and this job restores it and ships the
          #                      result to the registry.
          #
          # A cold toolchain install costs ~30s. Releases are not hot-path.
          cache: false

      - name: Install musl toolchain
        if: contains(matrix.targets, 'musl')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes musl-tools

      - name: Add rustup targets
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          for target in $TARGETS; do
            rustup target add "$target"
          done

      # Stamp BEFORE compiling. env!("CARGO_PKG_VERSION") is baked in at compile
      # time, so `prk --version` is correct by construction rather than by a
      # second string somebody has to remember to update.
      - name: Stamp version
        env:
          VERSION: ${{ needs.version.outputs.version || '0.0.0-dev' }}
        run: node scripts/version.mjs set "$VERSION"

      - name: Build
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          for target in $TARGETS; do
            echo "::group::${target}"
            # musl links statically via +crt-static (see .cargo/config.toml),
            # which needs a musl-aware linker driver.
            case "$target" in
              *-linux-musl)
                linker_var="CARGO_TARGET_$(printf '%s' "$target" | tr 'a-z-' 'A-Z_')_LINKER"
                export "${linker_var}=musl-gcc"
                ;;
            esac
            # cargo-auditable, not plain cargo: it embeds the resolved
            # dependency list into the binary so `cargo audit bin ./prk` works
            # on a downloaded artefact with no SBOM file alongside it.
            mise run build:auditable "$target"
            echo "::endgroup::"
          done

      - name: Collect binaries
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          for target in $TARGETS; do
            out="dist/bin/${target}"
            mkdir -p "$out"
            if [ -f "target/${target}/dist/prk.exe" ]; then
              cp "target/${target}/dist/prk.exe" "${out}/prk.exe"
            elif [ -f "target/${target}/dist/prk" ]; then
              cp "target/${target}/dist/prk" "${out}/prk"
            else
              echo "::error::No prk binary found for ${target} under target/${target}/dist/"
              ls -R "target/${target}" || true
              exit 1
            fi
          done
          find dist/bin -type f -print

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.name }}
          path: dist/bin/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Archives, checksums, the ten npm package trees, SBOMs and attestations.
  # ---------------------------------------------------------------------------
  package:
    name: package
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # actions/attest needs all three. `artifact-metadata: write` became
      # mandatory in February 2026; omitting it fails late and unhelpfully.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # Caching is off in BOTH directions. This workflow is reachable only
          # by a tag push, and it publishes to npm and creates a GitHub Release
          # -- so it is a publishing workflow in exactly the sense that makes a
          # restored cache entry dangerous.
          #
          #   cache_save: false  would only stop us writing an entry a later
          #                      privileged run consumes.
          #   cache: false       also stops us READING one -- which is the
          #                      actual cache-poisoning path: a lower-privilege
          #                      workflow (e.g. a fork PR) writes a malicious
          #                      entry, and this job restores it and ships the
          #                      result to the registry.
          #
          # A cold toolchain install costs ~30s. Releases are not hot-path.
          cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist/bin

      - name: Restore executable bits
        run: |
          set -euo pipefail
          # The artifact upload/download round trip does not preserve mode bits.
          find dist/bin -type f ! -name '*.exe' -exec chmod +x {} +
          find dist/bin -type f -print

      # -----------------------------------------------------------------------
      # HARD GATE: every shipped binary must carry a readable embedded
      # dependency list. A silently empty audit section is worse than no section
      # at all, because `cargo audit bin` then produces something that looks
      # like a clean report. Symbol stripping is the known way to lose it, so
      # this must fail here rather than after publication.
      # -----------------------------------------------------------------------
      - name: Verify embedded audit data
        env:
          # prk depends on clap, reqwest and tokio; the real figure is in the
          # hundreds. Anything below this means the section was lost, not that
          # the dependency tree shrank.
          MIN_EMBEDDED_CRATES: "20"
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r bin; do
            echo "::group::cargo audit bin ${bin}"
            status=0
            out="$(mise run audit:bin "$bin" 2>&1)" || status=$?
            printf '%s\n' "$out"
            echo "::endgroup::"

            # Match the line that ATTESTS the section is present:
            #
            #   Found 'cargo auditable' data in dist/bin/…/prk (165 dependencies)
            #
            # This used to look for "(N crate dependencies)", which is what
            # `cargo audit` prints when it scans Cargo.lock -- not what
            # `cargo audit bin` prints when it reads a binary. No line ever
            # matched, `count` was always empty, and the step below therefore
            # failed every single time with "found 'none'". It had never run
            # before this release, so nobody had seen it.
            #
            # Keyed on the sentence rather than on any parenthesised number, so
            # a future line that happens to carry a count in brackets cannot
            # satisfy a check about embedded audit data.
            count="$(
              printf '%s\n' "$out" \
                | sed -n "s/.*'cargo auditable' data in .*(\([0-9][0-9]*\) dependencies).*/\1/p" \
                | head -n 1
            )"

            if [ -z "$count" ] || [ "$count" -lt "$MIN_EMBEDDED_CRATES" ]; then
              echo "::error::${bin} carries no readable embedded dependency list (found '${count:-none}', need >= ${MIN_EMBEDDED_CRATES}). It was probably not built with cargo-auditable, or the audit section was stripped."
              failed=1
              continue
            fi

            if [ "$status" -ne 0 ]; then
              echo "::error::cargo audit bin reported findings for ${bin} (exit ${status})."
              failed=1
              continue
            fi

            echo "${bin}: ${count} embedded crate dependencies, no findings"
          done < <(find dist/bin -type f \( -name prk -o -name prk.exe \) | sort)

          [ "$failed" -eq 0 ]

      # Stamp again: the npm package.json files and the archive names are all
      # generated in this job.
      - name: Stamp version
        env:
          VERSION: ${{ needs.version.outputs.version || '0.0.0-dev' }}
        run: node scripts/version.mjs set "$VERSION"

      - name: Build archives and checksums
        env:
          VERSION: ${{ needs.version.outputs.version || '0.0.0-dev' }}
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          staging="$(mktemp -d)"

          for dir in dist/bin/*/; do
            target="$(basename "$dir")"
            work="${staging}/prk-${VERSION}-${target}"
            mkdir -p "$work"
            cp "$dir"/prk* "$work/"
            cp LICENSE README.md "$work/"

            case "$target" in
              *windows*)
                ( cd "$staging" && zip -q -r "prk-${VERSION}-${target}.zip" "prk-${VERSION}-${target}" )
                mv "${staging}/prk-${VERSION}-${target}.zip" dist/assets/
                ;;
              *)
                tar -czf "dist/assets/prk-${VERSION}-${target}.tar.gz" -C "$staging" "prk-${VERSION}-${target}"
                ;;
            esac
          done

          # `sha256sum` output is exactly the two-column format that
          # actions/attest consumes as `subject-checksums`.
          ( cd dist/assets && sha256sum -- * > SHA256SUMS )
          cat dist/assets/SHA256SUMS

      # The MCP server is TypeScript, so unlike the CLI it has nothing in the
      # build matrix: it is compiled once, here, immediately before the packages
      # are assembled. The version was stamped into its manifest above, and its
      # `initialize` response reads the version back out of that file at
      # startup, so there is no second place for it to drift.
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the MCP server
        run: mise run build:mcp

      # -----------------------------------------------------------------------
      # The ten npm package trees: eight platform packages that declare `bin`
      # directly, the parent that depends on them optionally, and the MCP
      # server, which is independent of both.
      #
      # Contract with scripts/: writes dist/npm/<pkg>/package.json for each,
      # reading the compiled binaries out of --bin-dir and the compiled MCP
      # server out of packages/mcp/dist.
      # -----------------------------------------------------------------------
      - name: Assemble npm packages
        env:
          VERSION: ${{ needs.version.outputs.version || '0.0.0-dev' }}
        run: |
          set -euo pipefail
          node scripts/npm-package.mjs \
            --version "$VERSION" \
            --bin-dir dist/bin \
            --out dist/npm
          find dist/npm -maxdepth 2 -name package.json -print

      # SBOMs cover the whole repository -- both halves. The embedded audit data
      # complements this for the Rust binaries; it does not replace it, because
      # nothing in a stripped ELF describes the pnpm dependency tree.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/prick-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest release artefacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # One call covers all eight archives plus SHA256SUMS itself.
          subject-checksums: dist/assets/SHA256SUMS

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/assets/SHA256SUMS
          sbom-path: dist/prick-sbom.spdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/assets/
            dist/prick-sbom.spdx.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: dist/npm/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publish.
  #
  # npm versions are immutable; dist-tags are not. That asymmetry is the only
  # atomicity primitive available, so everything lands under `next` first and
  # `latest` moves only once all ten packages are readable from the registry
  # and a real install has produced a working binary. The parent moves LAST:
  # until it does, `npm install @yashau/prick` still resolves to the previous
  # good release.
  # ---------------------------------------------------------------------------
  publish-npm:
    name: publish-npm
    needs: [version, package]
    # The TRIGGER is the gate, not an input. A dispatched run has claimed no
    # version, so publishing from one would put a version on npm that no tag
    # points at -- and npm versions are immutable. `dry_run` is documentation;
    # this line is enforcement.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # npm trusted publishing (OIDC). No long-lived token exists to leak, and
      # provenance is attached automatically -- hence no --provenance flag.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # Caching is off in BOTH directions. This workflow is reachable only
          # by a tag push, and it publishes to npm and creates a GitHub Release
          # -- so it is a publishing workflow in exactly the sense that makes a
          # restored cache entry dangerous.
          #
          #   cache_save: false  would only stop us writing an entry a later
          #                      privileged run consumes.
          #   cache: false       also stops us READING one -- which is the
          #                      actual cache-poisoning path: a lower-privilege
          #                      workflow (e.g. a fork PR) writes a malicious
          #                      entry, and this job restores it and ships the
          #                      result to the registry.
          #
          # A cold toolchain install costs ~30s. Releases are not hot-path.
          cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: dist/npm

      - name: Use a publish-capable npm # zizmor: ignore[adhoc-packages]
        run: |
          set -euo pipefail
          # OIDC trusted publishing needs npm >= 11.5.1. pnpm is deliberately
          # NOT used to publish: pnpm 11 dropped its npm CLI fallback and its
          # own OIDC path regressed in 11.0.8.
          # The publishing client itself cannot come from the workspace
          # lockfile; it is what consumes the lockfile's output.
          npm install --global npm@^11.5.1
          npm --version

      - name: Publish under the `next` tag
        run: |
          set -euo pipefail

          # Package names are read out of the generated manifests rather than
          # hardcoded here, so renaming a platform package cannot desynchronise
          # the publish list from what was actually assembled.
          parent=""
          mcp=""
          platforms=()
          for manifest in dist/npm/*/package.json; do
            dir="$(dirname "$manifest")"
            name="$(jq -r '.name' "$manifest")"
            case "$name" in
              "@yashau/prick")     parent="$dir" ;;
              "@yashau/prick-mcp") mcp="$dir" ;;
              *)                   platforms+=("$dir") ;;
            esac
          done

          if [ -z "$parent" ]; then
            echo "::error::No parent package (@yashau/prick) found under dist/npm/."
            exit 1
          fi
          if [ -z "$mcp" ]; then
            echo "::error::No MCP package (@yashau/prick-mcp) found under dist/npm/; the package job builds it with mise run build:mcp."
            exit 1
          fi
          if [ "${#platforms[@]}" -ne 8 ]; then
            echo "::error::Expected 8 platform packages, found ${#platforms[@]}."
            printf '%s\n' "${platforms[@]}"
            exit 1
          fi

          publish_one() {
            local dir="$1" name version
            name="$(jq -r '.name' "${dir}/package.json")"
            version="$(jq -r '.version' "${dir}/package.json")"
            # Idempotent: a rerun of the same tag resumes rather than failing on
            # the packages that already landed.
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} already published, skipping"
              return 0
            fi
            echo "publishing ${name}@${version}"
            npm publish "$dir" --tag next --access public
          }

          # Platform packages first. The parent's optionalDependencies point at
          # them by exact version, so publishing the parent first would create a
          # window in which it is installable and broken.
          for dir in "${platforms[@]}"; do
            publish_one "$dir"
          done
          # The MCP server depends on nothing here and nothing here depends on
          # it, so its only ordering constraint is the one below: the parent is
          # the last thing this release does.
          publish_one "$mcp"
          publish_one "$parent"

      - name: Verify registry propagation
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for manifest in dist/npm/*/package.json; do
            name="$(jq -r '.name' "$manifest")"
            ok=0
            for attempt in $(seq 1 30); do
              if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
                ok=1
                break
              fi
              echo "waiting for ${name}@${VERSION} (attempt ${attempt})"
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::${name}@${VERSION} never became readable from the registry. The latest dist-tag has NOT been moved; the previous release is still current."
              exit 1
            fi
            echo "${name}@${VERSION} is readable"
          done

      - name: Install smoke test # zizmor: ignore[adhoc-packages]
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          pushd "$work" >/dev/null
          npm init --yes >/dev/null

          # --ignore-scripts on purpose: a security-conscious user runs it, and
          # the whole reason these are real platform packages rather than a
          # postinstall downloader is that they must work without scripts.
          # Installing from the public registry with no lockfile is the point:
          # this reproduces exactly what a user gets.
          npm install --ignore-scripts "@yashau/prick@${VERSION}"

          bin="./node_modules/.bin/prk"
          [ -x "$bin" ] || { echo "::error::prk was not installed as an executable."; exit 1; }

          reported="$("$bin" --version)"
          echo "prk --version -> ${reported}"
          case "$reported" in
            *"$VERSION"*) ;;
            *) echo "::error::Installed binary reports '${reported}', expected it to contain '${VERSION}'."; exit 1 ;;
          esac
          popd >/dev/null

          # Check the artefact that actually came back from the registry, not
          # just the one built upstairs. The parent package's bin is a Node
          # shim, so the native executable is located inside whichever platform
          # package the install resolved to.
          real="$(find "${work}/node_modules" -type f -name prk -not -path '*/.bin/*' -print -quit)"
          if [ -z "$real" ]; then
            echo "::error::Could not find the installed native binary under node_modules."
            find "${work}/node_modules/@yashau" -maxdepth 3 -type f -print || true
            exit 1
          fi
          echo "::group::cargo audit bin ${real}"
          status=0
          out="$(mise run audit:bin "$real" 2>&1)" || status=$?
          printf '%s\n' "$out"
          echo "::endgroup::"
          count="$(printf '%s\n' "$out" | sed -n 's/.*(\([0-9][0-9]*\) crate dependencies).*/\1/p' | head -n 1)"
          if [ -z "$count" ] || [ "$count" -lt 20 ]; then
            echo "::error::The published binary carries no readable embedded dependency list."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo audit bin reported findings against the published binary."
            exit 1
          fi

      # The equivalent gate for the MCP server. `--version` loads dist/main.js,
      # which imports the MCP SDK at module scope, so a clean run proves three
      # things at once: the compiled output is complete, the runtime
      # dependencies published in the manifest actually resolve, and the version
      # the server reports over MCP is the one being released.
      - name: MCP install smoke test # zizmor: ignore[adhoc-packages]
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          npm init --yes >/dev/null
          npm install --ignore-scripts "@yashau/prick-mcp@${VERSION}"

          bin="./node_modules/.bin/prick-mcp"
          [ -x "$bin" ] || { echo "::error::prick-mcp was not installed as an executable."; exit 1; }

          # --version writes to stderr: stdout belongs to the JSON-RPC transport
          # even before a client attaches.
          reported="$("$bin" --version 2>&1 >/dev/null)"
          echo "prick-mcp --version -> ${reported}"
          case "$reported" in
            *"$VERSION"*) ;;
            *) echo "::error::The published MCP server reports '${reported}', expected it to contain '${VERSION}'."; exit 1 ;;
          esac

          # Invariant 3, checked against what came back from the registry rather
          # than against what was rendered upstairs. The workspace manifest uses
          # `workspace:` and `catalog:`; npm publishes those verbatim, and a
          # consumer cannot resolve either.
          published="./node_modules/@yashau/prick-mcp/package.json"
          if ! node -e '
            const pkg = require(require("path").resolve(process.argv[1]));
            const bad = [];
            for (const field of ["dependencies", "optionalDependencies", "peerDependencies"]) {
              for (const [name, spec] of Object.entries(pkg[field] || {})) {
                if (/^(workspace|catalog|catalogs|link|portal):/.test(spec)) {
                  bad.push(field + " " + name + " = " + spec);
                }
              }
            }
            if (bad.length > 0) { console.error(bad.join("\n")); process.exit(1); }
          ' "$published"; then
            echo "::error::The published MCP manifest carries a dependency spec npm cannot resolve."
            exit 1
          fi

      - name: Move `latest`
        env:
          # OIDC covers `npm publish`. If the registry requires a credential for
          # dist-tag mutation, an optional granular token is used for this step
          # alone; absent the secret, the OIDC session is attempted.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "${HOME}/.npmrc"
          fi

          parent=""
          mcp=""
          platforms=()
          for manifest in dist/npm/*/package.json; do
            name="$(jq -r '.name' "$manifest")"
            case "$name" in
              "@yashau/prick")     parent="$name" ;;
              "@yashau/prick-mcp") mcp="$name" ;;
              *)                   platforms+=("$name") ;;
            esac
          done

          # This is the flip. Everything above it is reversible by doing nothing.
          for name in "${platforms[@]}"; do
            npm dist-tag add "${name}@${VERSION}" latest
          done
          npm dist-tag add "${mcp}@${VERSION}" latest
          # Parent last: this single call is what makes the release live.
          npm dist-tag add "${parent}@${VERSION}" latest

          echo "### Published \`${VERSION}\` to npm as \`latest\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # GitHub release. Created as a draft with every asset attached, undrafted only
  # once the upload has completed, so the release page is never visible in a
  # state where a platform is missing.
  # ---------------------------------------------------------------------------
  github-release:
    name: github-release
    needs: [version, package, publish-npm]
    # Same gate as publish-npm: only a tag push has a tag to release.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # The tag list is needed to pin the notes range -- see below.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      # Two release lines share this repository's releases, so the "previous
      # release" GitHub would pick on its own may be a docs release, which would
      # generate notes over a commit range that has nothing to do with the CLI.
      # The range is therefore pinned to the previous `v*` tag explicitly.
      - name: Find the previous CLI tag
        id: previous
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -v -x -F -- "$TAG" | head -n 1 || true)"
          echo "previous tag: ${previous:-<none>}"
          echo "tag=${previous}" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; refreshing assets"
            gh release upload "$TAG" dist/assets/* dist/prick-sbom.spdx.json --clobber
          else
            notes_range=()
            if [ -n "$PREVIOUS_TAG" ]; then
              notes_range=(--notes-start-tag "$PREVIOUS_TAG")
            fi
            gh release create "$TAG" \
              --draft \
              --title "$TAG" \
              --generate-notes \
              "${notes_range[@]}" \
              --verify-tag \
              dist/assets/* dist/prick-sbom.spdx.json
          fi

      - name: Undraft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          echo "### Released [\`${TAG}\`](${SERVER_URL}/${REPO}/releases/tag/${TAG})" >> "$GITHUB_STEP_SUMMARY"
