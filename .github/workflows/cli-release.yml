name: CLI release

# CUTTING THE VERSION IS WHAT RELEASES.
#
# `mise run cli:cut` computes the CalVer version, takes a typed confirmation,
# creates the annotated `v<version>` tag and pushes it. That push is the trigger
# below. This workflow computes no version and claims nothing: it builds,
# publishes and releases the commit it was handed.
#
# The tag is still the lock — git refuses to push a ref that already exists, so
# two people cutting in the same second cannot both take the same N — but the
# claim, and the retry when it is lost, now happen in scripts/version.mjs
# (`claimTag`) before any runner starts. Consequences worth stating:
#
#   * this workflow needs no `contents: write` to plan and persists no git
#     credential; the only write permission left is the one that creates the
#     GitHub Release.
#   * the version is a decision a human made, recorded in git, before CI ran --
#     rather than something CI derived and the human read about afterwards.
#   * docs-release.yml works identically. One mechanism, two release lines.
#
# `v*` cannot collide with the documentation line's `docs-v*`: a tag glob is
# anchored at the start of the ref name, and `docs-v2026.815.0` does not begin
# with `v`. Asserted in scripts/version.test.mjs rather than assumed.
on:
  push:
    tags:
      - "v*"
  # Dry runs only. A dispatched run builds every binary and stages every npm
  # package so the pipeline can be exercised without claiming a version; the
  # publish and release jobs below are gated on the event being a tag push, so a
  # dispatch can never publish however its inputs are set.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package everything, but publish nothing. A dispatched run cannot publish; leave this true"
        type: boolean
        default: true

permissions:
  contents: read

# Never cancel a release. A cancelled run between `npm publish` and the dist-tag
# flip leaves the registry in a half-published state that no rerun can undo,
# because npm versions are immutable.
concurrency:
  group: cli-release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # CalVer is computed in UTC. A runner on any other zone would compute a
  # different date for six hours a day.
  TZ: UTC

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # RESOLVE the version. It is not computed here and it is not claimed here.
  #
  #   tag push  -> the version is the tag, minus its `v`. The claim already
  #                happened, locally, in `mise run cli:cut`.
  #   dispatch  -> nothing has been claimed, so a read-only prediction stands in
  #                so that the packaging steps have a plausible version to stamp.
  #                `version.mjs plan` reads tags and writes none.
  #
  # This job holds no write permission and persists no credential. That is the
  # point of the inversion: nothing in CI can move a ref.
  # ---------------------------------------------------------------------------
  version:
    name: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The dispatch path predicts N from how many tags already exist for
          # today, so the full tag list must be present -- a shallow clone
          # silently predicts N=0.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # Caching is off in BOTH directions. This workflow is reachable only
          # by a tag push, and it publishes to npm and creates a GitHub Release
          # -- so it is a publishing workflow in exactly the sense that makes a
          # restored cache entry dangerous.
          #
          #   cache_save: false  would only stop us writing an entry a later
          #                      privileged run consumes.
          #   cache: false       also stops us READING one -- which is the
          #                      actual cache-poisoning path: a lower-privilege
          #                      workflow (e.g. a fork PR) writes a malicious
          #                      entry, and this job restores it and ships the
          #                      result to the registry.
          #
          # A cold toolchain install costs ~30s. Releases are not hot-path.
          cache: false

      # A dispatched run can never publish (see the `if:` on publish-npm and
      # github-release). Saying so out loud beats letting somebody dispatch with
      # dry_run=false and wonder why nothing reached npm.
      - name: Refuse a non-dry dispatch
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          echo '::error::A dispatched run cannot publish. Releasing is "mise run cli:cut", which pushes the tag that triggers this workflow.'
          exit 1

      - name: Resolve version
        id: resolve
        env:
          # Through the environment, never interpolated into the script body: a
          # ref name is chosen by whoever pushed the tag.
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "push" ]; then
            version="${REF_NAME#v}"
            # The tag is the only input, so it is validated rather than trusted.
            # `version.mjs set` would reject a bad one later; failing here says
            # why, before six build legs have run.
            if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "::error::${REF_NAME} is not a CalVer release tag (expected vYYYY.MMDD.N with no leading zeros)."
              exit 1
            fi
            tag="$REF_NAME"
            echo "released version ${version} from tag ${tag}"
          else
            version="$(node scripts/version.mjs plan | awk '$1 == "version" { print $2 }')"
            tag="v${version}"
            echo "dry run: predicted ${tag}. No tag is claimed and nothing is published."
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          {
            echo "### CLI release"
            echo
            echo "- trigger: \`${EVENT}\`"
            echo "- version: \`${VERSION}\`"
            echo "- tag: \`${TAG}\`"
            if [ "$EVENT" != "push" ]; then
              echo
              echo "Dry run — no tag was claimed and nothing will be published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Six runner legs, eight artefacts. macOS and Windows each build two targets
  # in one job: the macOS SDK is universal, and the Windows image ships both the
  # x64 and ARM64 MSVC toolchains, so a second runner would buy nothing.
  #
  # No `cross`, no Docker, no qemu -- free arm64 runners exist now, so every
  # target is built natively or by a first-party cross-linker.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # A partial set of binaries must never reach `package`. If one target
      # fails to compile, the release does not happen.
      fail-fast: true
      matrix:
        include:
          - name: linux-x64-gnu
            os: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu
          - name: linux-x64-musl
            os: ubuntu-24.04
            targets: x86_64-unknown-linux-musl
          - name: linux-arm64-gnu
            os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu
          - name: linux-arm64-musl
            os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-musl
          - name: darwin
            os: macos-15
            targets: x86_64-apple-darwin aarch64-apple-darwin
          - name: windows
            os: windows-2025
            targets: x86_64-pc-windows-msvc aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag was created at this commit, so building the SHA is the same
          # tree without racing the tag's propagation to the API.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # Caching is off in BOTH directions. This workflow is reachable only
          # by a tag push, and it publishes to npm and creates a GitHub Release
          # -- so it is a publishing workflow in exactly the sense that makes a
          # restored cache entry dangerous.
          #
          #   cache_save: false  would only stop us writing an entry a later
          #                      privileged run consumes.
          #   cache: false       also stops us READING one -- which is the
          #                      actual cache-poisoning path: a lower-privilege
          #                      workflow (e.g. a fork PR) writes a malicious
          #                      entry, and this job restores it and ships the
          #                      result to the registry.
          #
          # A cold toolchain install costs ~30s. Releases are not hot-path.
          cache: false

      - name: Install musl toolchain
        if: contains(matrix.targets, 'musl')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes musl-tools

      - name: Add rustup targets
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          for target in $TARGETS; do
            rustup target add "$target"
          done

      # Stamp BEFORE compiling. env!("CARGO_PKG_VERSION") is baked in at compile
      # time, so `prk --version` is correct by construction rather than by a
      # second string somebody has to remember to update.
      - name: Stamp version
        env:
          VERSION: ${{ needs.version.outputs.version || '0.0.0-dev' }}
        run: node scripts/version.mjs set "$VERSION"

      - name: Build
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          for target in $TARGETS; do
            echo "::group::${target}"
            # musl links statically via +crt-static (see .cargo/config.toml),
            # which needs a musl-aware linker driver.
            case "$target" in
              *-linux-musl)
                linker_var="CARGO_TARGET_$(printf '%s' "$target" | tr 'a-z-' 'A-Z_')_LINKER"
                export "${linker_var}=musl-gcc"
                ;;
            esac
            # cargo-auditable, not plain cargo: it embeds the resolved
            # dependency list into the binary so `cargo audit bin ./prk` works
            # on a downloaded artefact with no SBOM file alongside it.
            mise run build:auditable "$target"
            echo "::endgroup::"
          done

      - name: Collect binaries
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          for target in $TARGETS; do
            out="dist/bin/${target}"
            mkdir -p "$out"
            if [ -f "target/${target}/dist/prk.exe" ]; then
              cp "target/${target}/dist/prk.exe" "${out}/prk.exe"
            elif [ -f "target/${target}/dist/prk" ]; then
              cp "target/${target}/dist/prk" "${out}/prk"
            else
              echo "::error::No prk binary found for ${target} under target/${target}/dist/"
              ls -R "target/${target}" || true
              exit 1
            fi
          done
          find dist/bin -type f -print

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.name }}
          path: dist/bin/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Archives, checksums, the ten npm package trees, SBOMs and attestations.
  # ---------------------------------------------------------------------------
  package:
    name: package
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # actions/attest needs all three. `artifact-metadata: write` became
      # mandatory in February 2026; omitting it fails late and unhelpfully.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # Caching is off in BOTH directions. This workflow is reachable only
          # by a tag push, and it publishes to npm and creates a GitHub Release
          # -- so it is a publishing workflow in exactly the sense that makes a
          # restored cache entry dangerous.
          #
          #   cache_save: false  would only stop us writing an entry a later
          #                      privileged run consumes.
          #   cache: false       also stops us READING one -- which is the
          #                      actual cache-poisoning path: a lower-privilege
          #                      workflow (e.g. a fork PR) writes a malicious
          #                      entry, and this job restores it and ships the
          #                      result to the registry.
          #
          # A cold toolchain install costs ~30s. Releases are not hot-path.
          cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist/bin

      - name: Restore executable bits
        run: |
          set -euo pipefail
          # The artifact upload/download round trip does not preserve mode bits.
          find dist/bin -type f ! -name '*.exe' -exec chmod +x {} +
          find dist/bin -type f -print

      # -----------------------------------------------------------------------
      # HARD GATE: every shipped binary must carry a readable embedded
      # dependency list. A silently empty audit section is worse than no section
      # at all, because `cargo audit bin` then produces something that looks
      # like a clean report. Symbol stripping is the known way to lose it, so
      # this must fail here rather than after publication.
      # -----------------------------------------------------------------------
      - name: Verify embedded audit data
        env:
          # prk depends on clap, reqwest and tokio; the real figure is in the
          # hundreds. Anything below this means the section was lost, not that
          # the dependency tree shrank.
          MIN_EMBEDDED_CRATES: "20"
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r bin; do
            echo "::group::cargo audit bin ${bin}"
            status=0
            out="$(mise run audit:bin "$bin" 2>&1)" || status=$?
            printf '%s\n' "$out"
            echo "::endgroup::"

            # Match the line that ATTESTS the section is present:
            #
            #   Found 'cargo auditable' data in dist/bin/…/prk (165 dependencies)
            #
            # This used to look for "(N crate dependencies)", which is what
            # `cargo audit` prints when it scans Cargo.lock -- not what
            # `cargo audit bin` prints when it reads a binary. No line ever
            # matched, `count` was always empty, and the step below therefore
            # failed every single time with "found 'none'". It had never run
            # before this release, so nobody had seen it.
            #
            # Keyed on the sentence rather than on any parenthesised number, so
            # a future line that happens to carry a count in brackets cannot
            # satisfy a check about embedded audit data.
            count="$(
              printf '%s\n' "$out" \
                | sed -n "s/.*'cargo auditable' data in .*(\([0-9][0-9]*\) dependencies).*/\1/p" \
                | head -n 1
            )"

            if [ -z "$count" ] || [ "$count" -lt "$MIN_EMBEDDED_CRATES" ]; then
              echo "::error::${bin} carries no readable embedded dependency list (found '${count:-none}', need >= ${MIN_EMBEDDED_CRATES}). It was probably not built with cargo-auditable, or the audit section was stripped."
              failed=1
              continue
            fi

            if [ "$status" -ne 0 ]; then
              echo "::error::cargo audit bin reported findings for ${bin} (exit ${status})."
              failed=1
              continue
            fi

            echo "${bin}: ${count} embedded crate dependencies, no findings"
          done < <(find dist/bin -type f \( -name prk -o -name prk.exe \) | sort)

          [ "$failed" -eq 0 ]

      # Stamp again: the npm package.json files and the archive names are all
      # generated in this job.
      - name: Stamp version
        env:
          VERSION: ${{ needs.version.outputs.version || '0.0.0-dev' }}
        run: node scripts/version.mjs set "$VERSION"

      - name: Build archives and checksums
        env:
          VERSION: ${{ needs.version.outputs.version || '0.0.0-dev' }}
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          staging="$(mktemp -d)"

          for dir in dist/bin/*/; do
            target="$(basename "$dir")"
            work="${staging}/prk-${VERSION}-${target}"
            mkdir -p "$work"
            cp "$dir"/prk* "$work/"
            cp LICENSE README.md "$work/"

            case "$target" in
              *windows*)
                ( cd "$staging" && zip -q -r "prk-${VERSION}-${target}.zip" "prk-${VERSION}-${target}" )
                mv "${staging}/prk-${VERSION}-${target}.zip" dist/assets/
                ;;
              *)
                tar -czf "dist/assets/prk-${VERSION}-${target}.tar.gz" -C "$staging" "prk-${VERSION}-${target}"
                ;;
            esac
          done

          # `sha256sum` output is exactly the two-column format that
          # actions/attest consumes as `subject-checksums`.
          ( cd dist/assets && sha256sum -- * > SHA256SUMS )
          cat dist/assets/SHA256SUMS

      # The MCP server is TypeScript, so unlike the CLI it has nothing in the
      # build matrix: it is compiled once, here, immediately before the packages
      # are assembled. The version was stamped into its manifest above, and its
      # `initialize` response reads the version back out of that file at
      # startup, so there is no second place for it to drift.
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the MCP server
        run: mise run build:mcp

      # -----------------------------------------------------------------------
      # The ten npm package trees: eight platform packages that declare `bin`
      # directly, the parent that depends on them optionally, and the MCP
      # server, which is independent of both.
      #
      # Contract with scripts/: writes dist/npm/<pkg>/package.json for each,
      # reading the compiled binaries out of --bin-dir and the compiled MCP
      # server out of packages/mcp/dist.
      # -----------------------------------------------------------------------
      - name: Assemble npm packages
        env:
          VERSION: ${{ needs.version.outputs.version || '0.0.0-dev' }}
        run: |
          set -euo pipefail
          node scripts/npm-package.mjs \
            --version "$VERSION" \
            --bin-dir dist/bin \
            --out dist/npm
          find dist/npm -maxdepth 2 -name package.json -print

      # SBOMs cover the whole repository -- both halves. The embedded audit data
      # complements this for the Rust binaries; it does not replace it, because
      # nothing in a stripped ELF describes the pnpm dependency tree.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/prick-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # -----------------------------------------------------------------------
      # Gated on the TRIGGER, exactly like publish-npm and github-release. An
      # attestation is a signed, publicly discoverable claim that a named
      # artefact came out of this repository -- and a dispatched run produces
      # archives nobody can download, under a version it never claimed. Signing
      # those puts entries in the repository's attestation store that no
      # consumer can ever match against a release asset, so the store stops
      # being a one-to-one record of what was shipped.
      #
      # The cost is real and worth stating: these two steps now first execute on
      # a release. What a dry run would have proven about them is thin, though --
      # both take the SHA256SUMS the archive step above already writes and cats,
      # so a rehearsal exercises the inputs without exercising the signing that
      # only a push can do anyway.
      # -----------------------------------------------------------------------
      - name: Attest release artefacts
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # One call covers all eight archives plus SHA256SUMS itself.
          subject-checksums: dist/assets/SHA256SUMS

      - name: Attest SBOM
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/assets/SHA256SUMS
          sbom-path: dist/prick-sbom.spdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/assets/
            dist/prick-sbom.spdx.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: dist/npm/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publish.
  #
  # npm versions are immutable; dist-tags are not. That asymmetry is the only
  # atomicity primitive available, so everything lands under `next` first and
  # `latest` moves only once all ten packages are readable from the registry
  # and a real install has produced a working binary. The parent moves LAST:
  # until it does, `npm install @yashau/prick` still resolves to the previous
  # good release.
  # ---------------------------------------------------------------------------
  publish-npm:
    name: publish-npm
    needs: [version, package]
    # The TRIGGER is the gate, not an input. A dispatched run has claimed no
    # version, so publishing from one would put a version on npm that no tag
    # points at -- and npm versions are immutable. `dry_run` is documentation;
    # this line is enforcement.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # npm trusted publishing (OIDC). No long-lived token exists to leak, and
      # provenance is attached automatically -- hence no --provenance flag.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # Caching is off in BOTH directions. This workflow is reachable only
          # by a tag push, and it publishes to npm and creates a GitHub Release
          # -- so it is a publishing workflow in exactly the sense that makes a
          # restored cache entry dangerous.
          #
          #   cache_save: false  would only stop us writing an entry a later
          #                      privileged run consumes.
          #   cache: false       also stops us READING one -- which is the
          #                      actual cache-poisoning path: a lower-privilege
          #                      workflow (e.g. a fork PR) writes a malicious
          #                      entry, and this job restores it and ships the
          #                      result to the registry.
          #
          # A cold toolchain install costs ~30s. Releases are not hot-path.
          cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: dist/npm

      # -----------------------------------------------------------------------
      # The artefact round trip does not preserve mode bits -- the same reason
      # the package job restores them on dist/bin. npm packs whatever mode it
      # finds on disk, so without this every platform package ships a 0644
      # binary, and the parent's Node shim dies with EACCES the first time
      # anybody runs `prk`.
      #
      # v2026.816.0 shipped exactly that. The bug was unreachable until then:
      # this job is gated on the tag push, so no dry run had ever executed a
      # single step of it. The smoke test below did catch it -- after ten
      # immutable versions were already on the registry, which is why the
      # assertion that follows exists.
      # -----------------------------------------------------------------------
      - name: Restore executable bits
        run: |
          set -euo pipefail
          find dist/npm -type f -name prk -exec chmod +x {} +
          find dist/npm -type f \( -name prk -o -name prk.exe \) -exec ls -l {} +

      # Assert BEFORE publishing. npm versions are immutable, so a mode
      # regression caught after `npm publish` cannot be fixed -- only rolled
      # forward. This is the last moment the failure is free.
      - name: Every packaged binary is executable
        run: |
          set -euo pipefail
          failed=0
          total=0
          native=0

          # Eight platform packages, but only SIX carry a mode bit that means
          # anything: the two Windows binaries are `prk.exe`, and executability
          # on Windows comes from the extension rather than from a permission.
          # Counting `-name prk` alone finds six and reports a false failure --
          # which is what it did on v2026.816.1, costing a CalVer N.
          while IFS= read -r bin; do
            total=$((total + 1))
            case "$bin" in
              *.exe) ;;
              *)
                native=$((native + 1))
                if [ ! -x "$bin" ]; then
                  echo "::error::${bin} is not executable; publishing it would ship a package that cannot run."
                  failed=1
                fi
                ;;
            esac
          done < <(find dist/npm -type f \( -name prk -o -name prk.exe \))

          # A silent zero would otherwise sail through while shipping nothing
          # runnable, so the count is asserted rather than assumed.
          if [ "$total" -ne 8 ]; then
            echo "::error::Expected 8 platform binaries under dist/npm, found ${total}."
            failed=1
          fi
          if [ "$native" -ne 6 ]; then
            echo "::error::Expected 6 non-Windows binaries needing an exec bit, found ${native}."
            failed=1
          fi

          [ "$failed" -eq 0 ]
          echo "${total} platform binaries; ${native} needed an exec bit and have one."

      - name: Use a publish-capable npm # zizmor: ignore[adhoc-packages]
        run: |
          set -euo pipefail
          # OIDC trusted publishing needs npm >= 11.5.1. pnpm is deliberately
          # NOT used to publish: pnpm 11 dropped its npm CLI fallback and its
          # own OIDC path regressed in 11.0.8.
          # The publishing client itself cannot come from the workspace
          # lockfile; it is what consumes the lockfile's output.
          npm install --global npm@^11.5.1
          npm --version

      - name: Publish under the `next` tag
        run: |
          set -euo pipefail

          # Package names are read out of the generated manifests rather than
          # hardcoded here, so renaming a platform package cannot desynchronise
          # the publish list from what was actually assembled.
          parent=""
          mcp=""
          platforms=()
          for manifest in dist/npm/*/package.json; do
            dir="$(dirname "$manifest")"
            name="$(jq -r '.name' "$manifest")"
            case "$name" in
              "@yashau/prick")     parent="$dir" ;;
              "@yashau/prick-mcp") mcp="$dir" ;;
              *)                   platforms+=("$dir") ;;
            esac
          done

          if [ -z "$parent" ]; then
            echo "::error::No parent package (@yashau/prick) found under dist/npm/."
            exit 1
          fi
          if [ -z "$mcp" ]; then
            echo "::error::No MCP package (@yashau/prick-mcp) found under dist/npm/; the package job builds it with mise run build:mcp."
            exit 1
          fi
          if [ "${#platforms[@]}" -ne 8 ]; then
            echo "::error::Expected 8 platform packages, found ${#platforms[@]}."
            printf '%s\n' "${platforms[@]}"
            exit 1
          fi

          publish_one() {
            local dir="$1" name version
            name="$(jq -r '.name' "${dir}/package.json")"
            version="$(jq -r '.version' "${dir}/package.json")"
            # Idempotent: a rerun of the same tag resumes rather than failing on
            # the packages that already landed.
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} already published, skipping"
              return 0
            fi
            echo "publishing ${name}@${version}"
            npm publish "$dir" --tag next --access public
          }

          # Platform packages first. The parent's optionalDependencies point at
          # them by exact version, so publishing the parent first would create a
          # window in which it is installable and broken.
          for dir in "${platforms[@]}"; do
            publish_one "$dir"
          done
          # The MCP server depends on nothing here and nothing here depends on
          # it, so its only ordering constraint is the one below: the parent is
          # the last thing this release does.
          publish_one "$mcp"
          publish_one "$parent"

      - name: Verify registry propagation
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for manifest in dist/npm/*/package.json; do
            name="$(jq -r '.name' "$manifest")"
            ok=0
            for attempt in $(seq 1 30); do
              if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
                ok=1
                break
              fi
              echo "waiting for ${name}@${VERSION} (attempt ${attempt})"
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::${name}@${VERSION} never became readable from the registry. The latest dist-tag has NOT been moved; the previous release is still current."
              exit 1
            fi
            echo "${name}@${VERSION} is readable"
          done

      - name: Install smoke test # zizmor: ignore[adhoc-packages]
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          pushd "$work" >/dev/null
          npm init --yes >/dev/null

          # --ignore-scripts on purpose: a security-conscious user runs it, and
          # the whole reason these are real platform packages rather than a
          # postinstall downloader is that they must work without scripts.
          # Installing from the public registry with no lockfile is the point:
          # this reproduces exactly what a user gets.
          npm install --ignore-scripts "@yashau/prick@${VERSION}"

          bin="./node_modules/.bin/prk"
          [ -x "$bin" ] || { echo "::error::prk was not installed as an executable."; exit 1; }

          reported="$("$bin" --version)"
          echo "prk --version -> ${reported}"
          case "$reported" in
            *"$VERSION"*) ;;
            *) echo "::error::Installed binary reports '${reported}', expected it to contain '${VERSION}'."; exit 1 ;;
          esac
          popd >/dev/null

          # Check the artefact that actually came back from the registry, not
          # just the one built upstairs. The parent package's bin is a Node
          # shim, so the native executable is located inside whichever platform
          # package the install resolved to.
          real="$(find "${work}/node_modules" -type f -name prk -not -path '*/.bin/*' -print -quit)"
          if [ -z "$real" ]; then
            echo "::error::Could not find the installed native binary under node_modules."
            find "${work}/node_modules/@yashau" -maxdepth 3 -type f -print || true
            exit 1
          fi
          echo "::group::cargo audit bin ${real}"
          status=0
          out="$(mise run audit:bin "$real" 2>&1)" || status=$?
          printf '%s\n' "$out"
          echo "::endgroup::"
          # Keyed on the sentence `cargo audit bin` actually prints:
          #
          #   Found 'cargo auditable' data in …/prk (165 dependencies)
          #
          # This is the SECOND copy of the bug 5e363bf fixed in the package job.
          # That one matched "(N crate dependencies)" -- `cargo audit`'s
          # lockfile wording, which `cargo audit bin` never emits -- so it could
          # never match and always failed. The fix landed in one place because
          # only one place had ever run; this job is gated on the tag push, so
          # its copy sat unexecuted until v2026.816.0.
          count="$(
            printf '%s\n' "$out" \
              | sed -n "s/.*'cargo auditable' data in .*(\([0-9][0-9]*\) dependencies).*/\1/p" \
              | head -n 1
          )"
          if [ -z "$count" ] || [ "$count" -lt 20 ]; then
            echo "::error::The published binary carries no readable embedded dependency list (found '${count:-none}')."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo audit bin reported findings against the published binary."
            exit 1
          fi

      # The equivalent gate for the MCP server. `--version` loads dist/main.js,
      # which imports the MCP SDK at module scope, so a clean run proves three
      # things at once: the compiled output is complete, the runtime
      # dependencies published in the manifest actually resolve, and the version
      # the server reports over MCP is the one being released.
      - name: MCP install smoke test # zizmor: ignore[adhoc-packages]
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          npm init --yes >/dev/null
          npm install --ignore-scripts "@yashau/prick-mcp@${VERSION}"

          bin="./node_modules/.bin/prick-mcp"
          [ -x "$bin" ] || { echo "::error::prick-mcp was not installed as an executable."; exit 1; }

          # --version writes to stderr: stdout belongs to the JSON-RPC transport
          # even before a client attaches.
          reported="$("$bin" --version 2>&1 >/dev/null)"
          echo "prick-mcp --version -> ${reported}"
          case "$reported" in
            *"$VERSION"*) ;;
            *) echo "::error::The published MCP server reports '${reported}', expected it to contain '${VERSION}'."; exit 1 ;;
          esac

          # Invariant 3, checked against what came back from the registry rather
          # than against what was rendered upstairs. The workspace manifest uses
          # `workspace:` and `catalog:`; npm publishes those verbatim, and a
          # consumer cannot resolve either.
          published="./node_modules/@yashau/prick-mcp/package.json"
          if ! node -e '
            const pkg = require(require("path").resolve(process.argv[1]));
            const bad = [];
            for (const field of ["dependencies", "optionalDependencies", "peerDependencies"]) {
              for (const [name, spec] of Object.entries(pkg[field] || {})) {
                if (/^(workspace|catalog|catalogs|link|portal):/.test(spec)) {
                  bad.push(field + " " + name + " = " + spec);
                }
              }
            }
            if (bad.length > 0) { console.error(bad.join("\n")); process.exit(1); }
          ' "$published"; then
            echo "::error::The published MCP manifest carries a dependency spec npm cannot resolve."
            exit 1
          fi

      - name: Move `latest`, or hand the promotion over
        env:
          # npm's trusted publishing grants `npm publish` and NOTHING else --
          # its Allowed-actions list has no dist-tag entry, and a dist-tag PUT
          # over the OIDC session returns a bare 401. Confirmed on v2026.816.2,
          # not assumed.
          #
          # npm will only issue the needed credential as a scope-wide
          # read/write token, which is exactly the standing secret OIDC
          # publishing exists to avoid. So the flip is OPTIONAL: with the secret
          # set, CI promotes; without it, CI stops at a fully published,
          # fully smoke-tested release and prints what to run.
          #
          # Published-but-unpromoted is a COMPLETE state, not a failure. Every
          # version is on the registry and immutable, and `latest` still points
          # where it did, so nobody is served a release nobody promoted. Failing
          # the job here would only cost the GitHub release below.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          parent=""
          mcp=""
          platforms=()
          for manifest in dist/npm/*/package.json; do
            name="$(jq -r '.name' "$manifest")"
            case "$name" in
              "@yashau/prick")     parent="$name" ;;
              "@yashau/prick-mcp") mcp="$name" ;;
              *)                   platforms+=("$name") ;;
            esac
          done

          # Parent last, on both paths. Until `@yashau/prick` moves, an install
          # resolves the previous parent, whose optionalDependencies pin exact
          # platform versions that are all still on the registry -- so there is
          # no half-promoted state a user can land in.
          ordered=("${platforms[@]}" "$mcp" "$parent")

          if [ -z "${NPM_TOKEN:-}" ]; then
            {
              echo "### \`${VERSION}\` is published, and not yet promoted"
              echo
              echo "All ten packages are on npm under \`next\` and passed both smoke tests."
              echo "\`latest\` is unchanged, so no installer resolves this release yet."
              echo
              echo "Promote it, parent last:"
              echo
              echo '```bash'
              for name in "${ordered[@]}"; do
                echo "npm dist-tag add \"${name}@${VERSION}\" latest"
              done
              echo '```'
              echo
              echo "Set the \`NPM_TOKEN\` secret to have CI do this instead."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "No NPM_TOKEN set — leaving the promotion to a human."
            echo "The commands are in this run's job summary."
            exit 0
          fi

          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "${HOME}/.npmrc"

          # This is the flip. Everything above it is reversible by doing nothing.
          for name in "${ordered[@]}"; do
            npm dist-tag add "${name}@${VERSION}" latest
          done

          echo "### Published \`${VERSION}\` to npm as \`latest\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # crates.io — the SOURCE distribution, and the one `cargo binstall` reads.
  #
  # `cargo publish --workspace` does the ordering itself: it reads the dependency
  # graph, publishes prick-core first and prk last, and verifies each crate
  # against the siblings it just packaged rather than against the registry --
  # which is the only reason a five-crate workspace can go out in one command
  # under a version that does not exist upstream yet. xtask stays behind because
  # it sets `publish = false`.
  #
  # THIS JOB RUNS ON A DRY RUN TOO, and that is the point. Four defects in this
  # workflow reached production because they sat behind
  # `if: github.event_name == 'push'` and had therefore never executed once. A
  # packaging fault -- a missing `description`, a path dependency with no
  # version, a file `exclude` drops that the build needs -- is exactly the class
  # `--dry-run` catches, and catching it costs nothing on a rehearsal.
  #
  # What a rehearsal still cannot reach: the OIDC exchange and the upload itself.
  # Those are one HTTP call each, after every check has already passed.
  #
  # A partial publish rolls FORWARD, like npm. Versions on crates.io are
  # immutable, so if prick-core lands and prick-auth then fails, re-running this
  # job fails on prick-core instead of resuming. Cut the next N.
  # ---------------------------------------------------------------------------
  publish-crates:
    name: publish-crates
    needs: [version, package, publish-npm]
    # `!cancelled()` rather than the default, which is `success()`: publish-npm
    # is SKIPPED on a dispatch, and a skipped dependency makes `success()` false
    # -- which would silently take the dry-run coverage above away again.
    #
    # But `!cancelled()` also switches OFF the implicit "every dependency
    # succeeded" gate, so a release must re-assert it by hand. Without the second
    # clause, a tag push whose publish-npm failed would go on to put five
    # immutable crates on crates.io for a release that exists nowhere else.
    if: ${{ !cancelled() && needs.package.result == 'success' && (github.event_name != 'push' || needs.publish-npm.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # crates.io trusted publishing. `cargo publish` still authenticates with a
      # registry token -- it always does -- but that token is MINTED HERE: this
      # permission lets the runner ask GitHub for an OIDC JWT, crates.io trades
      # the JWT for a temporary token, and the action's `post` step revokes it
      # when the job ends. So -- as with npm above -- there is no standing
      # credential in this repository to leak.
      id-token: write
    env:
      # Read at job level because the `secrets` context is not available in a
      # step `if:`. Empty except during the one-time bootstrap described below.
      BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # Caching is off in BOTH directions, for the reason given on every
          # other job here: this workflow publishes to a registry, so a restored
          # cache entry written by a lower-privilege workflow is a supply-chain
          # path into a signed artefact.
          cache: false

      # Stamp before packaging, exactly as the build job stamps before
      # compiling. `cargo publish` reads the version out of the manifest, and
      # every manifest in the tree reads 0.0.0-dev until this runs.
      - name: Stamp version
        env:
          VERSION: ${{ needs.version.outputs.version || '0.0.0-dev' }}
        run: node scripts/version.mjs set "$VERSION"

      # Only a tag push gets a credential. On a dispatch this step is skipped,
      # `steps.auth.outputs.token` is empty, and the publish below is a dry run
      # that never reaches an endpoint needing one.
      #
      # It is ALSO skipped when CARGO_REGISTRY_TOKEN is set, and that is the
      # bootstrap. crates.io will not configure a trusted publisher for a crate
      # that does not exist yet -- "initial publish requires an API token", in
      # its own words -- and all five of ours are new. So the FIRST release runs
      # on a hand-made token in that secret, trusted publishing is configured
      # against the five crates it creates, and the secret is deleted. Every
      # release after that takes the branch below and needs no stored
      # credential. Identical in shape to the npm bootstrap this repository
      # already did, and to the same end.
      - name: Exchange OIDC for a crates.io token
        id: auth
        if: github.event_name == 'push' && env.BOOTSTRAP_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          # The minted token first, the bootstrap secret only if there is none.
          # Once the secret is deleted this reads exactly as it did before it
          # existed, so the bootstrap leaves no permanent branch behind.
          #
          # The outer `github.event_name == 'push' && ... || ''` is not
          # decoration. The OIDC step is already gated on the trigger, but the
          # secret is not -- so without this a DRY RUN would put the bootstrap
          # token in its environment, on every rehearsal, to run a `--dry-run`
          # that never authenticates. A credential should not be present in a
          # job that has no use for it.
          CARGO_REGISTRY_TOKEN: ${{ github.event_name == 'push' && (steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN) || '' }}
          EVENT: ${{ github.event_name }}
          VERSION: ${{ needs.version.outputs.version || '0.0.0-dev' }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "push" ]; then
            echo "publishing ${VERSION} to crates.io"
            mise run publish:crates
          else
            echo "dry run: packaging and verifying ${VERSION}, uploading nothing"
            mise run publish:crates --dry-run
          fi

      - name: Summary
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ needs.version.outputs.version || '0.0.0-dev' }}
        run: |
          set -euo pipefail
          {
            if [ "$EVENT" = "push" ]; then
              echo "### crates.io"
              echo
              echo "Published \`${VERSION}\`: prick-core, prick-api, prick-exec, prick-auth, prk."
              echo
              echo '```bash'
              echo "cargo binstall prk    # fetches the release archive"
              echo "cargo install prk     # builds from source"
              echo '```'
            else
              echo "### crates.io (rehearsal)"
              echo
              echo "All five crates packaged and verified at \`${VERSION}\`. Nothing was uploaded."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # GitHub release. Created as a draft with every asset attached, undrafted only
  # once the upload has completed, so the release page is never visible in a
  # state where a platform is missing.
  # ---------------------------------------------------------------------------
  github-release:
    name: github-release
    needs: [version, package, publish-npm]
    # Same gate as publish-npm: only a tag push has a tag to release.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # The tag list is needed to pin the notes range -- see below.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      # Two release lines share this repository's releases, so the "previous
      # release" GitHub would pick on its own may be a docs release, which would
      # generate notes over a commit range that has nothing to do with the CLI.
      # The range is therefore pinned to the previous `v*` tag explicitly.
      - name: Find the previous CLI tag
        id: previous
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -v -x -F -- "$TAG" | head -n 1 || true)"
          echo "previous tag: ${previous:-<none>}"
          echo "tag=${previous}" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          # Titled "CLI <version>", matching docs-release.yml's "Docs <version>".
          # Two release lines share one list, so a bare tag is ambiguous in it --
          # `v2026.816.2` next to `Docs 2026.815.1` does not say which is which.
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; refreshing assets"
            gh release upload "$TAG" dist/assets/* dist/prick-sbom.spdx.json --clobber
          else
            notes_range=()
            if [ -n "$PREVIOUS_TAG" ]; then
              notes_range=(--notes-start-tag "$PREVIOUS_TAG")
            fi
            gh release create "$TAG" \
              --draft \
              --title "CLI ${VERSION}" \
              --generate-notes \
              "${notes_range[@]}" \
              --verify-tag \
              dist/assets/* dist/prick-sbom.spdx.json
          fi

      - name: Undraft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          echo "### Released [\`${TAG}\`](${SERVER_URL}/${REPO}/releases/tag/${TAG})" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Scoop and Homebrew.
  #
  # Both are the same shape: one generated file, committed into a repository
  # somebody has added as a bucket or a tap. scripts/dist-manifests.mjs renders
  # both from the SHA256SUMS the package job already wrote and attested -- no
  # archive is downloaded and nothing is re-hashed here, so a manifest can never
  # point at bytes that were not signed.
  #
  # RENDERING RUNS ON A DRY RUN; only the commit is gated. The generator is a
  # tested script (scripts/dist-manifests.test.mjs), and a rehearsal prints
  # exactly what a release would commit into the job summary.
  #
  # The commit is OPTIONAL, on the same terms as npm's `latest` promotion above:
  # with the GitHub App configured it happens, and without it the job prints the
  # manifests and exits 0. A release whose bucket has not caught up is a
  # complete release -- the archives, the attestations and the GitHub release
  # page are all already published.
  # ---------------------------------------------------------------------------
  publish-manifests:
    name: publish-manifests
    needs: [version, package, github-release]
    # See publish-crates: github-release is skipped on a dispatch, and the
    # default `success()` would skip this job with it -- but `!cancelled()` also
    # switches off the implicit "every dependency succeeded" gate, so the release
    # path has to re-assert it. Without the second clause, a tag push whose
    # github-release failed would still commit a Scoop manifest and a Homebrew
    # formula whose every URL is a 404.
    if: ${{ !cancelled() && needs.package.result == 'success' && (github.event_name != 'push' || needs.github-release.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Read here rather than in a step `if:`, because the `secrets` context is
      # not available in one. Empty when the App has not been set up, which is
      # what the no-credential path below keys on.
      DIST_APP_ID: ${{ secrets.DIST_APP_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # Caching is off in BOTH directions, for the reason given on every
          # other job here.
          cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Render the manifests
        env:
          VERSION: ${{ needs.version.outputs.version || '0.0.0-dev' }}
        run: mise run dist:manifests "$VERSION" dist/assets/SHA256SUMS dist/manifests

      # Printed on BOTH paths. On a rehearsal this is the whole output of the
      # job; on a release it is the record of what was committed.
      - name: Summary
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ needs.version.outputs.version || '0.0.0-dev' }}
        run: |
          set -euo pipefail
          {
            echo "### Scoop and Homebrew manifests for \`${VERSION}\`"
            if [ "$EVENT" != "push" ]; then
              echo
              echo "Rehearsal — rendered, not committed."
            fi
            echo
            echo "<details><summary><code>bucket/prk.json</code></summary>"
            echo
            echo '```json'
            cat dist/manifests/scoop/prk.json
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<details><summary><code>Formula/prk.rb</code></summary>"
            echo
            echo '```ruby'
            cat dist/manifests/homebrew/prk.rb
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-manifests
          path: dist/manifests/
          if-no-files-found: error
          retention-days: 7

      # A repository-scoped installation token, minted for this run and expiring
      # in an hour. Installed on the bucket and the tap only -- it cannot reach
      # this repository, and there is no standing PAT to rotate or leak.
      - name: Mint an installation token
        id: app-token
        if: github.event_name == 'push' && env.DIST_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DIST_APP_ID }}
          private-key: ${{ secrets.DIST_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            scoop-bucket
            homebrew-prick
          # Narrowed to the one verb this job uses. Without it the token carries
          # everything the App installation was granted, which is a wider
          # credential than "write two files" needs and outlives the mistake
          # that would widen the installation later.
          permission-contents: write

      # Committed through the contents API rather than by cloning. Two files in
      # two repositories is not worth a working tree, and it keeps the token out
      # of a remote URL, out of `.git/config` and off the disk entirely.
      - name: Commit to the bucket and the tap
        if: github.event_name == 'push' && env.DIST_APP_ID != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          commit() {
            repo="$1"; dest="$2"; src="$3"; message="$4"

            # The blob sha of what is there now. Absent the first time, which is
            # a create rather than an update -- and also the guard that makes
            # this a compare-and-swap: if somebody else moved the file between
            # the read and the write, the API rejects the stale sha.
            sha="$(gh api "repos/${OWNER}/${repo}/contents/${dest}" --jq .sha 2>/dev/null || true)"

            args=(--method PUT "repos/${OWNER}/${repo}/contents/${dest}"
                  -f "message=${message}"
                  -f "content=$(base64 -w0 < "$src")")

            # Absent on the first commit into an empty bucket, which the API
            # treats as a create; present on every release after that.
            if [ -n "$sha" ]; then
              args+=(-f "sha=${sha}")
            fi

            gh api "${args[@]}" --jq '.commit.html_url'
          }

          echo "::group::scoop-bucket"
          commit scoop-bucket bucket/prk.json dist/manifests/scoop/prk.json \
            "prk: Update to version ${VERSION}"
          echo "::endgroup::"

          echo "::group::homebrew-prick"
          commit homebrew-prick Formula/prk.rb dist/manifests/homebrew/prk.rb \
            "prk ${VERSION}"
          echo "::endgroup::"

          {
            echo
            echo "Committed to \`${OWNER}/scoop-bucket\` and \`${OWNER}/homebrew-prick\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hand the commit over
        if: github.event_name == 'push' && env.DIST_APP_ID == ''
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo
            echo "No \`DIST_APP_ID\` secret, so nothing was committed. The two files above go to:"
            echo
            echo "- \`${OWNER}/scoop-bucket\` → \`bucket/prk.json\`"
            echo "- \`${OWNER}/homebrew-prick\` → \`Formula/prk.rb\`"
            echo
            echo "Both are attached to this run as the \`package-manifests\` artefact."
            echo "See \`docs/contributing/releasing.md\` for the one-time App setup."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "No DIST_APP_ID set — leaving the bucket and tap to a human."

  # ---------------------------------------------------------------------------
  # WinGet.
  #
  # The odd one out, in three ways worth knowing before this job is debugged:
  #
  #   1. It cannot be rehearsed. komac reads the published release and opens a
  #      pull request against microsoft/winget-pkgs, so there is nothing for a
  #      dispatch to do that would not be either a no-op or a spurious PR. This
  #      is the one gated-and-unrehearsed step left in this workflow, and it is
  #      also the only publish here that is REVERSIBLE -- a wrong pull request is
  #      closed, where a wrong npm version or crate version is permanent.
  #   2. It cannot use the GitHub App. An installation token can only act on
  #      repositories the App is installed on, and nobody installs an App on
  #      microsoft/winget-pkgs -- so opening a pull request there needs a token
  #      that acts as a USER. That is a classic PAT with `public_repo`, and it is
  #      the one standing credential in this pipeline. Absent, this job says so
  #      and exits 0.
  #   3. The FIRST submission of a package is a manual `komac new`. This action
  #      updates an identifier winget-pkgs already knows; it cannot introduce
  #      one. See docs/contributing/releasing.md.
  # ---------------------------------------------------------------------------
  publish-winget:
    name: publish-winget
    needs: [version, github-release]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    env:
      # Same reason as publish-manifests: `secrets` is not readable from a
      # step `if:`.
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit to microsoft/winget-pkgs
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: yashau.prick
          version: ${{ needs.version.outputs.version }}
          release-tag: ${{ needs.version.outputs.tag }}
          # Both Windows archives, and nothing else on a release page that also
          # carries six tarballs, SHA256SUMS and an SBOM.
          installers-regex: '-pc-windows-msvc\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Hand the submission over
        if: env.WINGET_TOKEN == ''
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "### WinGet — not submitted"
            echo
            echo "No \`WINGET_TOKEN\` secret is set, so \`${VERSION}\` was not offered to winget-pkgs."
            echo
            echo '```bash'
            echo "komac update yashau.prick --version ${VERSION} \\"
            echo "  --urls \\"
            echo "    https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/prk-${VERSION}-x86_64-pc-windows-msvc.zip \\"
            echo "    https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/prk-${VERSION}-aarch64-pc-windows-msvc.zip \\"
            echo "  --submit"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "No WINGET_TOKEN set — leaving the winget-pkgs pull request to a human."
