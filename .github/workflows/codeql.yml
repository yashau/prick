name: CodeQL

# Deliberately a separate workflow, and deliberately NOT part of the `ci-ok`
# gate. CodeQL's value is a triaged queue of findings in the Security tab, not a
# red X on a pull request: it is slower than the rest of CI, its rule set moves
# without us changing anything, and a false positive that blocks merges gets
# switched off within a week. Alerts are reviewed; they do not block.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published rule reaches a quiet main rather than
    # surprising whoever opens the next pull request.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      # Required for CodeQL to read workflow run metadata on private repos.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # `actions` analyses the workflows in this directory: injection into
          # `run:` bodies, unpinned third-party actions, over-broad permissions.
          - language: actions
          - language: javascript-typescript
          - language: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          # No build is performed for any of the three. Rust supports only
          # `none`; for the other two it avoids installing a toolchain and
          # running arbitrary build scripts purely to satisfy the extractor.
          build-mode: none
          queries: security-and-quality
          # `e2e/` is a test harness, not shipped code. It exists to hold
          # credentials and fire them at a server, so it trips the rules that
          # describe exactly that -- `js/file-access-to-http` on a token read
          # from the harness's own handoff file, over and over.
          #
          # Scanning it produced findings nobody could act on and made the check
          # permanently red, which is the failure mode this workflow's header
          # warns about: a gate that is always red is a gate nobody reads.
          #
          # This narrows coverage, and the narrowing is the point of the
          # boundary: `crates/`, `packages/` and `scripts/` -- everything that
          # ships or runs a release -- are still analysed in full.
          config: |
            paths-ignore:
              - e2e/**

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}
