name: Bug report
description: Something behaves differently from how it is documented.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you write anything: this is a public issue tracker.**

        If what you are about to report is a security vulnerability, close this
        page and
        [open a private security advisory](https://github.com/yashau/prick/security/advisories/new)
        instead.

  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction
      description: >
        Log output from a secrets manager is the one category of paste that can
        turn a bug report into an incident. `prk` masks secret values, but it
        does not mask hostnames, account identifiers, service token client IDs
        or the `CF_Authorization` cookie -- and a stack trace or a HAR file
        redacts nothing at all.
      options:
        - label: >
            I have removed secret values, API tokens, Cloudflare account and
            zone IDs, Access service token client IDs and secrets, JWTs and
            session cookies from everything I am about to paste.
          required: true

  - type: input
    id: version
    attributes:
      label: prk --version
      description: Paste the full output.
      placeholder: prk 2026.819.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux (x86_64, glibc)
        - Linux (x86_64, musl)
        - Linux (aarch64, glibc)
        - Linux (aarch64, musl)
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows (x86_64)
        - Windows (arm64)
        - Not applicable -- this is a web UI or Worker issue
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How was it installed?
      options:
        - npm / pnpm (@yashau/prick)
        - GitHub release archive
        - cargo binstall
        - Built from source
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: >
        Include the exact command you ran. If the output was long, `--json`
        output is usually more useful than a screenshot.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >
        A reproduction against a scratch project and environment is far more
        useful than one against real data -- and safer for you.
      placeholder: |
        1. prk projects create scratch
        2. prk env create scratch/dev
        3. ...
    validations:
      required: true

  - type: input
    id: request-id
    attributes:
      label: X-Request-Id
      description: >
        If the error came from the server, it carried a request id. Pasting it
        lets an administrator find the exact audit row.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: >
        Cloudflare Access configuration, whether you use a service token or SSO,
        a corporate TLS proxy, unusual `PRK_*` environment variables.
    validations:
      required: false
