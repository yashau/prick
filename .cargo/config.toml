[alias]
xtask = "run --package xtask --"
lint = "clippy --workspace --all-targets -- -D warnings"
# prick-core is the miri target: pure, no I/O, no async, no unsafe, no FFI.
miri-core = "miri test -p prick-core"

# Static CRT everywhere it matters. On musl this produces a genuinely static
# binary; on windows-msvc it removes the VC++ redistributable dependency, so the
# published .exe runs on a clean machine.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
