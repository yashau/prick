<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="prick">
  <!--
    Not a logo, just a favicon. Starlight references /favicon.svg on every page
    by default; without this file each page load takes a 404.

    Plain by intent: a lowercase "p" on a rounded square, no wordmark, no
    artwork to keep in sync with anything. The colours invert with the reader's
    theme so the tab icon stays legible in both.
  -->
  <style>
    .bg { fill: #16161d; }
    .fg { fill: #ffffff; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; }
      .fg { fill: #16161d; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7" />
  <path
    class="fg"
    d="M10 8.5h3.1v1.8a5.2 5.2 0 0 1 4.1-2c3.6 0 6.3 2.9 6.3 7s-2.7 7-6.3 7a5.2 5.2 0 0 1-4.1-2v6.2H10Zm3.1 6.8v2.6a3.7 3.7 0 0 0 3.6 3.5c2.2 0 3.7-1.8 3.7-4.1s-1.5-4.1-3.7-4.1a3.7 3.7 0 0 0-3.6 3.5Z"
  />
</svg>
