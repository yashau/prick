[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# The pnpm side of the repo lives under packages/ and e2e/. Cargo must never
# walk into it: a stray Cargo.toml in a node_modules tree would otherwise be
# picked up as a workspace member.
exclude = ["packages", "e2e", "action", "node_modules", "dist"]

[workspace.package]
# The git tag is the source of truth for the release version. Everything in the
# tree reads 0.0.0-dev; scripts/version.mjs stamps the real CalVer immediately
# before compiling, so env!("CARGO_PKG_VERSION") is correct by construction.
# Do not hand-edit this into a real version.
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/yashau/prick"
homepage = "https://github.com/yashau/prick"
authors = ["yashau"]

[workspace.dependencies]
prk = { path = "crates/prk", version = "0.0.0-dev" }
prick-api = { path = "crates/prick-api", version = "0.0.0-dev" }
prick-auth = { path = "crates/prick-auth", version = "0.0.0-dev" }
prick-core = { path = "crates/prick-core", version = "0.0.0-dev" }
prick-exec = { path = "crates/prick-exec", version = "0.0.0-dev" }

base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
clap_mangen = "0.2"
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features = false keeps the `asm` feature (and its cc/FFI build) off.
# prick-core must stay FFI-free so `cargo miri test -p prick-core` is meaningful.
sha2 = { version = "0.10", default-features = false, features = ["std"] }
thiserror = "2"

# --- impure crates only -----------------------------------------------------
#
# Nothing below may become a dependency of prick-core. `cargo miri test -p
# prick-core` is what enforces that: miri cannot execute a syscall, so the
# moment one of these reaches that crate its suite stops passing.

# TLS is rustls + ring, everywhere, always. default-features = false is
# load-bearing twice over: it keeps reqwest off `native-tls` (and therefore off
# `openssl-sys`, whose aarch64-musl cross build is the worst part of Rust
# release engineering), and it keeps rustls off `aws-lc-rs`, whose cmake/C
# build would put a compiler toolchain on the critical path for every target.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-manual-roots",
  "charset",
  "http2",
  "json",
  "gzip",
  "system-proxy",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
# So a corporate TLS-inspecting proxy with a private certificate authority
# works from the OS trust store without a flag or an environment variable.
rustls-platform-verifier = "0.7"
# current-thread. A CLI that issues one request at a time has no concurrency to
# exploit, and a work-stealing scheduler is pure overhead and extra threads.
tokio = { version = "1", default-features = false, features = [
  "rt",
  "net",
  "io-util",
  "time",
  "macros",
  "process",
  "sync",
] }

secrecy = { version = "0.10", features = ["serde"] }
zeroize = "1"
getrandom = "0.3"
open = "5"
# Reads the terminal device directly, so a masked prompt and a piped --stdin
# never contend for the same stream.
rpassword = "7"
url = "2.5"

libc = "0.2"
which = "8"
windows-sys = "0.61"

# dev-only
# reqwest's own request/response types are built from `http`, so a test can hand
# `read_capped_body` a response of an exact length without standing up a server
# to serve one.
http = "1"
tempfile = "3"
wiremock = "0.6"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unsafe_code = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# stdout/stderr discipline. Only crates/prk/src/output/mod.rs is allowed to
# write to a stream. This is the mechanism that turns "a secret leaked to
# stderr" into a build failure rather than something a reviewer has to notice.
print_stdout = "deny"
print_stderr = "deny"

# Nothing in a secrets manager gets to abort on a bad assumption.
dbg_macro = "deny"
exit = "deny"
mem_forget = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

# Pedantic lints that fight the house style rather than improving it.
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 16
strip = "debuginfo"

# Used for published artefacts only. Slower to build, smaller and faster to run.
[profile.dist]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
